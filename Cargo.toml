[workspace]
resolver = "2"
members = [
    "crates/openmoat-core",
    "crates/openmoat-hosts",
    "crates/openmoat-audit",
    "crates/openmoat-proxy",
    "crates/openmoat-cli",
    "crates/openmoat-sdk",
    "crates/openmoat-wasm",
]
# Fuzz targets build with nightly and `cargo fuzz`; they are their own workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.21.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crocodile-labs/openmoat"
homepage = "https://github.com/crocodile-labs/openmoat"
authors = ["Crocodile Labs and OpenMoat contributors"]
keywords = ["ai-agents", "security", "policy", "mcp", "guardrails"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
openmoat-core = { path = "crates/openmoat-core", version = "0.21.0" }
openmoat-hosts = { path = "crates/openmoat-hosts", version = "0.21.0" }
openmoat-audit = { path = "crates/openmoat-audit", version = "0.21.0" }
openmoat-proxy = { path = "crates/openmoat-proxy", version = "0.21.0" }
openmoat-sdk = { path = "crates/openmoat-sdk", version = "0.21.0" }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize", "serialize"] }
# `float_roundtrip`: a number OpenMoat reads from a host's config file and
# writes back keeps its exact value.
serde_json = { version = "1", features = ["float_roundtrip"] }
globset = "0.4"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
regex = "1"
sha2 = "0.11"
# Random bytes from the OS on every platform: the proxy session key (ADR-044)
# is made on Windows too, which has no `/dev/urandom`.
getrandom = "0.4"
tempfile = "3"
httparse = "1.10"
signal-hook = { version = "0.4", default-features = false }
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"
# `openat`, `renameat`, `unlinkat` and the rest without `unsafe`: a restore
# writes relative to a folder it holds open (ADR-085 §4); std has no such calls.
# Already in the lock through `tempfile`. `process` and `event`: a `command`
# secret source's whole process group is ended at its time limit, and its
# output is read with a deadline (ADR-087). `termios`: a secret typed at the
# terminal is read with echo off (`terminal/secret.rs`).
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "process", "event", "termios"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
zeroize = "1"
# TLS termination for brokered secrets (ADR-043): `ring` as the provider, no
# aws-lc-rs (a C and cmake build), and the platform's roots for upstreams.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "zeroize"] }
rustls-native-certs = "0.8"
similar = { version = "3", default-features = false, features = ["text"] }
# The state directory's access list on Windows (ADR-083): the current
# account, a folder's owner and DACL, a new DACL. Already in the lock on
# Windows through rustix, tempfile and errno; the same version.
windows-sys = { version = "0.61.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn" # nursery; threshold in clippy.toml
# Restriction lints: no lint is silenced with `#[allow]`, and no debugging
# leftovers reach main.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# The guard hashes its own binary once per change (ADR-071); unoptimised,
# SHA-256 of a debug binary takes seconds, which every test home would pay.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Release archives (dist) build with the release profile.
[profile.dist]
inherits = "release"
