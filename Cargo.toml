[workspace]
resolver = "2"
members = [
    "crates/openmoat-core",
    "crates/openmoat-hosts",
    "crates/openmoat-audit",
    "crates/openmoat-proxy",
    "crates/openmoat-cli",
]
# Fuzz targets build with nightly and `cargo fuzz`; they are their own workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.5.0-rc.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/crocodile-labs/openmoat"
homepage = "https://github.com/crocodile-labs/openmoat"
authors = ["Crocodile Labs and OpenMoat contributors"]
keywords = ["ai-agents", "security", "policy", "mcp", "guardrails"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
openmoat-core = { path = "crates/openmoat-core", version = "0.5.0-rc.1" }
openmoat-hosts = { path = "crates/openmoat-hosts", version = "0.5.0-rc.1" }
openmoat-audit = { path = "crates/openmoat-audit", version = "0.5.0-rc.1" }
openmoat-proxy = { path = "crates/openmoat-proxy", version = "0.5.0-rc.1" }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize", "serialize"] }
serde_json = "1"
globset = "0.4"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
sha2 = "0.11"
tempfile = "3"
httparse = "1.10"
signal-hook = { version = "0.4", default-features = false }
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
zeroize = "1"
similar = { version = "3", default-features = false, features = ["text"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn" # nursery; threshold in clippy.toml
# Restriction lints: no lint is silenced with `#[allow]`, and no debugging
# leftovers reach main.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Release archives (dist) build with the release profile.
[profile.dist]
inherits = "release"
