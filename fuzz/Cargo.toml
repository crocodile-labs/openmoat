[package]
name = "openmoat-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "Fuzz targets for OpenMoat's untrusted-input surfaces"

[package.metadata]
cargo-fuzz = true

# Not part of the main workspace: built with nightly by `cargo fuzz`.
[workspace]
members = ["."]

# A copy of the main workspace's lints (a separate workspace cannot inherit
# them); CI's fuzz job runs clippy with these.
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
# What crates/openmoat-cli/src/json5.rs, compiled into openclaw_json5, uses.
anyhow = "1"
serde_json = "1"
libfuzzer-sys = "0.4"
openmoat-core = { path = "../crates/openmoat-core" }
openmoat-hosts = { path = "../crates/openmoat-hosts" }
openmoat-proxy = { path = "../crates/openmoat-proxy" }

[[bin]]
name = "decide_shell"
path = "fuzz_targets/decide_shell.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_parse"
path = "fuzz_targets/policy_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "host_payload"
path = "fuzz_targets/host_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "literal_pattern"
path = "fuzz_targets/literal_pattern.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy_parse"
path = "fuzz_targets/proxy_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openclaw_json5"
path = "fuzz_targets/openclaw_json5.rs"
test = false
doc = false
bench = false
