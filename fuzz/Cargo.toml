[package]
name = "openmoat-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "Fuzz targets for OpenMoat's untrusted-input surfaces"

[package.metadata]
cargo-fuzz = true

# `anyhow` and `serde` are used by CLI files the targets compile through
# `#[path]` (json5.rs, mcp/relay.rs); cargo-machete does not follow that.
[package.metadata.cargo-machete]
ignored = ["anyhow", "serde"]

# Not part of the main workspace: built with nightly by `cargo fuzz`.
[workspace]
members = ["."]

# A copy of the main workspace's lints (a separate workspace cannot inherit
# them); clippy in fuzz/ runs with these.
[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
# What crates/openmoat-cli/src/json5.rs (openclaw_json5) and
# crates/openmoat-cli/src/mcp/relay.rs (mcp_relay_framing) use.
anyhow = "1"
serde = "1"
# As the main workspace: json5.rs's numbers survive being written back.
serde_json = { version = "1", features = ["float_roundtrip"] }
libfuzzer-sys = "0.4"
openmoat-core = { path = "../crates/openmoat-core" }
openmoat-hosts = { path = "../crates/openmoat-hosts" }
openmoat-proxy = { path = "../crates/openmoat-proxy" }

[[bin]]
name = "decide_shell"
path = "fuzz_targets/decide_shell.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_parse"
path = "fuzz_targets/policy_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "host_payload"
path = "fuzz_targets/host_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "literal_pattern"
path = "fuzz_targets/literal_pattern.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy_parse"
path = "fuzz_targets/proxy_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openclaw_json5"
path = "fuzz_targets/openclaw_json5.rs"
test = false
doc = false
bench = false

[[bin]]
name = "repo_policy_merge"
path = "fuzz_targets/repo_policy_merge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_relay_framing"
path = "fuzz_targets/mcp_relay_framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "check_diff_parse"
path = "fuzz_targets/check_diff_parse.rs"
test = false
doc = false
bench = false
