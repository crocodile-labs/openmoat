[package]
name = "openmoat"
description = "Policy guard for AI coding agents: decides allow, ask or deny for every tool call from Claude Code, Codex and Cursor, configures Claude Code's and Codex's own OS sandboxes from the same policy, and keeps a local audit log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "moat"
path = "src/main.rs"

[dependencies]
openmoat-core.workspace = true
openmoat-hosts.workspace = true
openmoat-audit.workspace = true
openmoat-proxy.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook.workspace = true
toml_edit.workspace = true
zeroize.workspace = true
similar.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
libc.workspace = true
seccompiler.workspace = true

[dev-dependencies]
openmoat-audit = { workspace = true, features = ["test-support"] }
globset.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# Release archives carry the repository README (install, status) rather than this
# crate's command reference.
[package.metadata.dist]
auto-includes = false
include = ["../../README.md", "../../CHANGELOG.md", "../../LICENSE-MIT", "../../LICENSE-APACHE"]
