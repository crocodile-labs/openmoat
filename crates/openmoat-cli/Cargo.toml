[package]
name = "openmoat"
description = "Policy checks for AI coding agents: decides allow, defer, review or deny for each tool call the hook of Claude Code, Codex, Cursor, Gemini CLI, GitHub Copilot CLI and seven more agents reports, configures Claude Code's, Codex's and Cursor's own OS sandboxes from the same policy, and keeps a local audit log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# `cargo run -p openmoat` runs `openmoat`, not the `moat` alias.
default-run = "openmoat"

[[bin]]
name = "openmoat"
path = "src/main.rs"

# The command's name up to 0.7.0, kept for a few releases: it starts the
# `openmoat` installed beside it with the same arguments.
[[bin]]
name = "moat"
path = "src/bin/moat.rs"

[features]
# The weekly latest-agents job's build only: `openmoat guard` copies each hook
# payload into `OPENMOAT_CAPTURE_DIR` (commands/guard/capture.rs), for the
# adapters' captured fixtures. Never on by default, so no release reads it.
capture-payloads = []

[dependencies]
openmoat-core.workspace = true
openmoat-hosts.workspace = true
openmoat-audit.workspace = true
openmoat-proxy.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom.workspace = true
httparse.workspace = true
signal-hook.workspace = true
toml_edit.workspace = true
zeroize.workspace = true
similar.workspace = true
# The approval channels' HTTPS (ADR-078, `remote/https.rs`): the TLS stack and roots
# the proxy already uses, so no new crate enters the build.
rustls.workspace = true
rustls-native-certs.workspace = true
# HMAC-SHA-1 for the possession gate's one-time codes (RFC 6238, ADR-117); RS256 for
# GitHub App and Google service-account JWTs and HMAC-SHA256 for AWS SigV4 in minted
# secrets (ADR-118, `secrets/mint/`). The `ring` the TLS stack and the audit
# checkpoints already build, so no new crate enters the build.
ring = { workspace = true, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
# `fcntl` and Linux's `close_range` on descriptor numbers `openmoat run`
# inherited (ADR-088, `commands/run/inherited.rs`): neither std nor rustix
# marks a descriptor close-on-exec by number without a borrow it cannot prove.
# Already built on every Unix through rustix and getrandom.
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# The state directory's access list through Win32 calls, not `icacls` or
# PowerShell, whose start-up cost seconds per `init` (ADR-083,
# `state_acl/windows/win32.rs`); and `openmoat run`'s write-restricted token
# and job object, which std cannot start a process under (ADR-115,
# `commands/run/windows/win32.rs`); and the agent account of ADR-129
# (`commands/run/windows/account/`): the account and its groups
# (NetManagement), its logon rights (the LSA, Authentication_Identity), its
# password encrypted with DPAPI (Cryptography), its place off the sign-in
# screen (Registry), its profile's removal (`DeleteProfileW`, UI_Shell) and
# its network filters (WindowsFilteringPlatform; `FwpmEngineOpen0` takes
# the RPC authentication service, Rpc).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
seccompiler.workspace = true

[dev-dependencies]
openmoat-audit = { workspace = true, features = ["test-support"] }
globset.workspace = true
regex.workspace = true
tempfile.workspace = true
# A local HTTPS collector for the audit delivery tests (ADR-081): the same
# TLS stack the proxy already builds with.
rcgen.workspace = true
rustls.workspace = true

[target.'cfg(unix)'.dev-dependencies]
# A pseudo-terminal for the test that a secret typed at the terminal is not
# echoed (`terminal/secret/tests.rs`); the same rustix.
rustix = { workspace = true, features = ["pty"] }

# The workspace's lints, except `unsafe_code`: `deny` instead of `forbid`, so
# `commands/run/inherited.rs` alone can `#[expect]` it for its `fcntl` and
# `close_range` calls (ADR-088); `openmoat-core`'s architecture test keeps every
# other file of the crate free of `unsafe`. Keep this table in step with
# Cargo.toml's.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Release archives carry the repository README (install, status) rather than this
# crate's command reference.
[package.metadata.dist]
auto-includes = false
include = ["../../README.md", "../../CHANGELOG.md", "../../LICENSE", "../../LICENSE-APACHE"]
