[package]
name = "openmoat"
description = "Policy checks for AI coding agents: decides allow, defer, review or deny for every tool call from Claude Code, Codex, Cursor, OpenClaw, GitHub Copilot CLI, pi and Gemini CLI, configures Claude Code's, Codex's and Cursor's own OS sandboxes from the same policy, and keeps a local audit log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# `cargo run -p openmoat` runs `openmoat`, not the `moat` alias.
default-run = "openmoat"

[[bin]]
name = "openmoat"
path = "src/main.rs"

# The command's name up to 0.7.0, kept for a few releases: it starts the
# `openmoat` installed beside it with the same arguments.
[[bin]]
name = "moat"
path = "src/bin/moat.rs"

[features]
# The weekly latest-agents job's build only: `openmoat guard` copies each hook
# payload into `OPENMOAT_CAPTURE_DIR` (commands/guard/capture.rs), for the
# adapters' captured fixtures. Never on by default, so no release reads it.
capture-payloads = []

[dependencies]
openmoat-core.workspace = true
openmoat-hosts.workspace = true
openmoat-audit.workspace = true
openmoat-proxy.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
getrandom.workspace = true
httparse.workspace = true
signal-hook.workspace = true
toml_edit.workspace = true
zeroize.workspace = true
similar.workspace = true
# The approval channels' HTTPS (ADR-078, `remote/https.rs`): the TLS stack and roots
# the proxy already uses, so no new crate enters the build.
rustls.workspace = true
rustls-native-certs.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
# `fcntl` and Linux's `close_range` on descriptor numbers `openmoat run`
# inherited (ADR-088, `commands/run/inherited.rs`): neither std nor rustix
# marks a descriptor close-on-exec by number without a borrow it cannot prove.
# Already built on every Unix through rustix and getrandom.
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
seccompiler.workspace = true

[dev-dependencies]
openmoat-audit = { workspace = true, features = ["test-support"] }
globset.workspace = true
regex.workspace = true
tempfile.workspace = true
# A local HTTPS collector for the audit delivery tests (ADR-081): the same
# TLS stack the proxy already builds with.
rcgen.workspace = true
rustls.workspace = true

# The workspace's lints, except `unsafe_code`: `deny` instead of `forbid`, so
# `commands/run/inherited.rs` alone can `#[expect]` it for its `fcntl` and
# `close_range` calls (ADR-088); `openmoat-core`'s architecture test keeps every
# other file of the crate free of `unsafe`. Keep this table in step with
# Cargo.toml's.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Release archives carry the repository README (install, status) rather than this
# crate's command reference.
[package.metadata.dist]
auto-includes = false
include = ["../../README.md", "../../CHANGELOG.md", "../../LICENSE", "../../LICENSE-APACHE"]
