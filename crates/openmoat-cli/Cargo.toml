[package]
name = "openmoat"
description = "Policy checks for AI coding agents: decides allow, defer, ask or deny for every tool call from Claude Code, Codex, Cursor, OpenClaw, GitHub Copilot CLI, pi and Gemini CLI, configures Claude Code's, Codex's and Cursor's own OS sandboxes from the same policy, and keeps a local audit log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# `cargo run -p openmoat` runs `openmoat`, not the `moat` alias.
default-run = "openmoat"

[[bin]]
name = "openmoat"
path = "src/main.rs"

# The command's name up to 0.7.0, kept for a few releases: it starts the
# `openmoat` installed beside it with the same arguments.
[[bin]]
name = "moat"
path = "src/bin/moat.rs"

[dependencies]
openmoat-core.workspace = true
openmoat-hosts.workspace = true
openmoat-audit.workspace = true
openmoat-proxy.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook.workspace = true
toml_edit.workspace = true
zeroize.workspace = true
similar.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
libc.workspace = true
seccompiler.workspace = true

[dev-dependencies]
openmoat-audit = { workspace = true, features = ["test-support"] }
globset.workspace = true
regex.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# Release archives carry the repository README (install, status) rather than this
# crate's command reference.
[package.metadata.dist]
auto-includes = false
include = ["../../README.md", "../../CHANGELOG.md", "../../LICENSE", "../../LICENSE-APACHE"]
