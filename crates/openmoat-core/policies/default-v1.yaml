# OpenMoat default policy, schema v1 (docs/POLICY.md).
# Evaluation: deny → allow → ask → defer → defaults. Strictest verdict wins across
# the atomic actions of one tool call. `${project}` is the trusted project root.
# `defer` leaves the call to the agent's own permission prompt (ADR-025): OpenMoat
# denies what must never happen and stays quiet about the rest.
# Deny rules are absolute (allow can never override them), so deny-by-default
# for a whole kind is expressed via `defaults`, with allow rules as the holes.
version: 1
defaults:
  "*": defer         # no rule matched: the agent's own permission prompt decides (ADR-025)
  net: deny          # outbound network: only hosts listed under allow
  fetch: defer       # a host fetch tool (WebFetch) reading an unlisted URL: no request body (ADR-017)
  web.search: allow  # a host search tool (WebSearch): recorded; asks after a secret read (session taint)
  tool.unknown: defer  # a host tool OpenMoat cannot classify; what its arguments name is checked too

deny:
  - id: secrets-paths
    reason: secret material
    fs.read: &secret-paths
      - "~/.ssh/**"
      - "~/.aws/**"
      - "~/.gnupg/**"
      - "~/.config/gh/**"
      - "~/.netrc"
      # netrc-style logins of Emacs and other tools, plain or encrypted
      - "~/.authinfo"
      - "~/.authinfo.gpg"
      - "~/.docker/config.json"
      # Podman, Buildah and Skopeo registry logins. The copy under
      # $XDG_RUNTIME_DIR is left out: a glob there makes Codex's Linux sandbox
      # scan /run/user, which fails on directories it cannot read.
      - "~/.config/containers/auth.json"
      # the DigitalOcean CLI's API token
      - "~/.config/doctl/config.yaml"
      - "~/.kube/**"
      - "~/.config/gcloud/**"
      - "~/.azure/**"
      # package-registry and git credential stores
      - "~/.git-credentials"
      - "~/.npmrc"
      - "~/.pypirc"
      - "~/.cargo/credentials"
      - "~/.cargo/credentials.toml"
      - "~/.gem/credentials"
      # database client passwords, Vault and Terraform tokens
      - "~/.pgpass"
      - "~/.my.cnf"
      - "~/.mylogin.cnf"
      - "~/.vault-token"
      - "~/.terraform.d/credentials.tfrc.json"
      # password managers and keyrings: 1Password CLI, pass, GNOME Keyring
      - "~/.config/op/**"
      - "~/.password-store/**"
      - "~/.local/share/keyrings/**"
      # shell history holds pasted tokens and passwords
      - "~/.zsh_history"
      - "~/.bash_history"
      - "**/.env"
      - "**/.env.*"
      - "**/.envrc"
      # committed templates of .env carry no values
      - "!**/.env.example"
      - "!**/.env.sample"
      - "!**/.env.template"
      - "!**/.env.dist"
      - "!**/.env.*.example"
      - "!**/.env.*.sample"
      - "!**/.env.*.template"
      - "~/Library/Keychains/**"
    fs.write: *secret-paths
    # commands that print a stored token or password
    shell:
      - "{gh,*/gh} auth token*"
      - "{gh,*/gh} auth status * --show-token*"
      - "{gh,*/gh} auth status * -t*"
      - "{gh,*/gh} auth status {--show-token,-t}*"
      - "{gcloud,*/gcloud} auth print-access-token*"
      - "{gcloud,*/gcloud} auth print-identity-token*"
      - "{gcloud,*/gcloud} auth application-default print-access-token*"
      - "{az,*/az} account get-access-token*"
      - "{aws,*/aws} configure export-credentials*"
      - "{aws,*/aws} configure get *secret*"
      # `--raw` prints the kubeconfig's tokens and keys, which it otherwise redacts
      - "{kubectl,*/kubectl} * config view * --raw*"
      - "git credential fill*"
      - "git credential-* get*"
      - "{security,*/security} find-{generic,internet}-password -{w,g}*"
      - "{security,*/security} find-{generic,internet}-password * -{w,g}*"
      - "{security,*/security} dump-keychain*"
      # the Linux keyring's equivalent (libsecret), where GitHub Copilot CLI,
      # Gemini CLI and Codex keep their logins when they use it
      - "{secret-tool,*/secret-tool} lookup*"
      # Vault secrets and the stored Vault token, 1Password values, Heroku's token
      - "{vault,*/vault} kv get*"
      - "{vault,*/vault} read*"
      - "{vault,*/vault} print token*"
      - "{op,*/op} read*"
      - "{op,*/op} item get * --reveal*"
      - "{heroku,*/heroku} auth:token*"
      # `pass NAME` shows a password like `pass show NAME`, `pass grep` prints
      # decrypted lines; the commands that only list, add, move or remove entries
      # (and `pass` alone, which lists them) print no password
      - "{pass,*/pass} ?*"
      - "!{pass,*/pass} {ls,list,find,search,init,insert,add,rm,remove,delete,mv,rename,cp,copy,git,help,version,--help,-h,--version}"
  # Maven and Gradle settings: repository passwords, signing keys, tokens. Not in
  # secrets-paths, whose paths the OS sandboxes deny too: `mvn` and `gradle` run
  # inside them must read these files. `hook_only` (ADR-034) denies the agent's own
  # reads and writes (a shell command naming them, file and MCP tools) and leaves
  # the sandboxes as they are; the build commands themselves keep their verdict.
  - id: build-credentials
    reason: build tool credentials
    hook_only: true
    fs.read: &build-credentials
      - "~/.m2/settings.xml"
      - "~/.m2/settings-security.xml"
      - "~/.gradle/gradle.properties"
    fs.write: *build-credentials
  # Where each supported agent keeps its login, provider keys and OAuth tokens.
  # Not in secrets-paths, whose paths the OS sandboxes deny too: under `openmoat
  # run` the agent itself runs in the sandbox and must read its own login.
  # `hook_only` (ADR-034) denies the agent's own tools reading or writing them
  # (a shell command naming them, file and MCP tools). The paths are generated
  # from each agent's spec (`crates/openmoat-hosts/tests/protect.rs`); a moved
  # agent directory (`CLAUDE_CONFIG_DIR`, `CODEX_HOME`, …) is followed as for
  # `kernel-self`
  - id: agent-credentials
    reason: an AI agent's own login, API keys or OAuth tokens
    hook_only: true
    fs.read: &agent-credentials
      # Claude Code: its login where it keeps it in a file (Linux and Windows, and
      # macOS when the Keychain refuses it) and the Anthropic profiles `ant auth
      # login` writes (docs: Authentication, Credential management)
      - "~/.claude/.credentials.json"
      - "~/.config/{anthropic,anthropic/**}"
      # Codex: its login (ChatGPT tokens or API key) and the file its MCP OAuth
      # tokens fall back to without a keyring (`codex-rs/login/src/auth/storage.rs`,
      # `rmcp-client/src/oauth.rs`)
      - "~/.codex/{auth.json,.credentials.json}"
      # Continue CLI: the hub login older releases kept (`src/auth/workos.ts`) and
      # the MCP sign-ins of `mcp-remote`, which `cn` starts for a remote server that
      # asks for one (`src/services/MCPService.ts`)
      - "~/.continue/auth.json"
      - "~/.mcp-auth/**"
      # OpenClaw: the databases of model sign-ins and MCP OAuth sessions, the
      # channel credentials, the file secret store and the older sign-in files
      # (`docs/gateway/security/secrets-and-storage.md`; its `.env` is
      # `secrets-paths`')
      - "~/.openclaw/{state/openclaw.sqlite*,agents/*/agent/openclaw-agent.sqlite*,agents/*/agent/auth.json,agents/*/agent/codex-home,agents/*/agent/codex-home/**,credentials,credentials/**,secrets.json,auth-profiles.json,auth-state.json,mcp-oauth,mcp-oauth/**}"
      # GitHub Copilot CLI: `config.json`, where its login goes when there is no
      # keychain, and the fallback stores of MCP sign-ins and MCP secrets
      # (docs: Authenticate Copilot CLI, config-dir reference)
      - "~/.copilot/{config.json,mcp-oauth-config,mcp-oauth-config/**,mcp-secrets,mcp-secrets/**}"
      # pi: its provider keys and OAuth tokens, the API keys `models.json` may
      # hold and its MCP sign-ins (`packages/coding-agent/src/config.ts`,
      # `docs/models.md`, `src/extensions/mcp/oauth.ts`)
      - "~/.pi/agent/{auth.json,models.json,mcp-auth.json}"
      # Gemini CLI: its Google sign-in, the MCP and A2A OAuth tokens (in
      # `~/.cache/.gemini` under the macOS Seatbelt sandbox) and the file its
      # keychain falls back to, whose key the agent could derive
      # (`core/src/config/storage.ts`, `services/fileKeychain.ts`)
      - "~/.gemini/{oauth_creds.json,mcp-oauth-tokens.json,a2a-oauth-tokens.json,gemini-credentials.json}"
      - "~/.cache/.gemini/{mcp-oauth-tokens.json,a2a-oauth-tokens.json}"
      # OpenCode: its provider keys and OAuth tokens, its MCP sign-ins and the
      # database holding its account tokens, in its data directory on every OS
      # (`packages/opencode/src/auth/index.ts`, `mcp/auth.ts`,
      # `core/src/database/database.ts`; `XDG_DATA_HOME` moving it is not followed)
      - "~/.local/share/opencode/{auth.json,mcp-auth.json,opencode*.db*}"
      # Hermes Agent: the secret files and folders its own file tools refuse
      # (`agent/file_safety.py`; its `.env` is `secrets-paths`'), in its home and
      # in each profile; its terminal tool reaches them, which this rule closes
      - "~/.hermes/{auth.json,auth.lock,.anthropic_oauth.json,webhook_subscriptions.json,auth/google_oauth.json,cache/bws_cache.json,mcp-tokens,mcp-tokens/**,vault,vault/**,webapp,webapp/**,browser-profile,browser-profile/**,profiles/*/auth.json,profiles/*/.anthropic_oauth.json,profiles/*/webhook_subscriptions.json,profiles/*/auth/google_oauth.json,profiles/*/cache/bws_cache.json,profiles/*/mcp-tokens,profiles/*/mcp-tokens/**,profiles/*/vault,profiles/*/vault/**,profiles/*/webapp,profiles/*/webapp/**,profiles/*/browser-profile,profiles/*/browser-profile/**}"
    fs.write: *agent-credentials
    # the agents' commands that print a stored key or token: pi's, and OpenCode
    # 2's export of every stored credential
    shell:
      - "{pi,*/pi} auth print-api-key*"
      - "{pi,*/pi} auth print-bearer-token*"
      - "{opencode,*/opencode,opencode2,*/opencode2} auth export*"
  - id: env-secrets
    reason: secret environment variable
    env.read: ["*_KEY", "*_TOKEN", "*_SECRET", "*_PASSWORD", "AWS_*", "GITHUB_TOKEN", "NPM_TOKEN",
      # passwords and connection strings that carry one; other `*_URL`s are not secret
      "*_PASS", "*_PASSWD", "*_PWD", "PGPASSWORD", "*_CREDENTIALS", "*_DSN",
      "DATABASE_URL", "*_DATABASE_URL", "REDIS_URL", "MONGODB_URI", "MONGO_URL"]
  - id: env-dump
    reason: prints every environment variable, secrets included
    shell:
      - "env $"
      - "env -0 $"
      - "env --null $"
      - "*/env $"
      - "printenv $"
      - "printenv -0 $"
      - "printenv --null $"
      - "*/printenv $"
      - "set $"
      - "export $"
      - "export -p $"
      - "declare $"
      - "declare -p $"
      - "declare -x $"
      - "typeset $"
      - "typeset -p $"
      - "typeset -x $"
      # `@proc-environ <path>` atoms: a read of `/proc/<pid>/environ`
      - "@proc-environ *"
      # `@env-dump <expression>` atoms: inline interpreter code that reads the
      # whole environment (`print(os.environ)`, `console.log(process.env)`)
      - "@env-dump *"
  - id: env-poison
    reason: changes how later commands resolve or load code
    # the classifier leaves out an assignment whose value changes nothing: an editor
    # set to `true`, `:` or `cat`, and `PATH` kept as `$PATH` or set to system
    # directories only (`shell/tokens.rs`)
    env.set: ["PATH", "LD_PRELOAD", "LD_LIBRARY_PATH", "DYLD_*", "NODE_OPTIONS", "PYTHONPATH", "GIT_*", "EDITOR", "VISUAL", "BASH_ENV", "ENV", "PROMPT_COMMAND", "MOAT_*"]
  - id: pipe-to-shell
    reason: executes remote or decoded content
    # a pipeline whose consumer runs its stdin as its program is also reported
    # as `<stages> | <interpreter>` with the consumer's options dropped
    # (shell/commands/pipelines.rs; `source`/`.` of stdin and `xargs <interpreter>`
    # count), so `$` matches it whatever they are, and not an interpreter given
    # its program on the line (`| python3 -c CODE`, `| node -e CODE`), which
    # reads the stream as data
    shell:
      - "curl * | {sh,bash,zsh,dash,ksh,fish,source,.} $"
      - "curl * | {python*,node,perl,ruby,php,deno,bun,pwsh} $"
      - "wget * | {sh,bash,zsh,dash,ksh,fish,source,.} $"
      - "wget * | {python*,node,perl,ruby,php,deno,bun,pwsh} $"
      # decoder stages are reported as a canonical `<decoder> -d | <interpreter>` pipeline
      - "* -d | {sh,bash,zsh,dash,ksh,fish,source,.} $"
      - "* -d | {python*,node,perl,ruby,php,deno,bun,pwsh} $"
      - "eval *"
  - id: destructive
    reason: irreversible damage
    # removing, moving or replacing the home directory or the root itself, however the
    # command spells the path (`~/`, `$HOME`, `${HOME}`, `/Users/me/`, `~/x/..`); paths
    # below them are not matched
    # and the raw disks under `/dev`, which no build writes
    fs.write: ["~", "/", "/dev/disk*", "/dev/rdisk*", "/dev/sd*", "/dev/nvme*", "/dev/mmcblk*", "/dev/vd*", "/dev/xvd*"]
    shell:
      # what that cannot see: an unexpanded `*` operand (the shell expands it to every
      # entry) and `//` (canonicalised as a network root); shell-only, so no OS layer
      # receives these spellings (`[{]`, `[}]` and `[*]` are literal characters)
      - "rm * {//,/[*],~/[*],$HOME/[*],$[{]HOME[}]/[*]}"
      - "rm -rf --no-preserve-root*"
      # git takes an unambiguous prefix of a long option (`--del` is `--delete`), so
      # `--for*` and `--de*`: no other `git push` option starts with either
      - "git push --for*"
      - "git push -f*"
      # a `+` refspec, and force flags after the remote or bundled with other short options
      - "git push * +*"
      - "git push * --for*"
      - "git push * -f*"
      - "git push * -[!o-]*f*"
      # deleting a remote branch: an empty source refspec (`:main`), `--delete`, `-d`
      - "git push * :?*"
      - "git push * --de*"
      - "git push * -d*"
      - "git push * -[!o-]*d*"
      - "git reset --hard*"
      - "git clean -fdx*"
      - "git stash drop*"
      - "git stash clear*"
      - "sudo *"
      - "mkfs*"
      - "dd if=*"
      - "shutdown *"
      - "reboot"
  - id: kernel-self
    reason: OpenMoat protects its own policy, hooks and binary
    # the state an agent has no reason to read: the audit log, the lock and what
    # it pins of trust, approvals and MCP pins. The policy itself stays readable;
    # moat's own commands read these as the person, outside any sandbox
    fs.read:
      - "~/.moat/audit.db*"
      - "~/.moat/policy.lock"
      - "~/.moat/hosts.json"
      - "~/.moat/approvals.json"
      - "~/.moat/trust.json"
      - "~/.moat/allowed_signers"
      - "~/.moat/mcp/**"
      # the key `openmoat proxy` checks session credentials with (ADR-044): who
      # reads it can make one for any session, a clean one included
      - "~/.moat/proxy.key"
      # the proxy CA (ADR-043): with its key a process could sign for the hosts
      # `tls: terminate` names
      - "~/.moat/proxy-ca/**"
      - "**/.moat/audit.db*"
      - "**/.moat/policy.lock"
      - "**/.moat/proxy.key"
      - "**/.moat/proxy-ca/**"
    fs.write:
      # the state and host directories themselves: renaming, deleting or replacing
      # one with a link removes every pinned file and hook inside it at once
      - "~/.moat"
      - "~/.claude"
      - "~/.codex"
      - "~/.cursor"
      - "**/.moat"
      - "**/.claude"
      - "**/.codex"
      - "**/.cursor"
      - "~/.moat/**"
      - "~/.claude/settings.json"
      - "~/.claude/settings.local.json"
      - "~/.codex/**"
      - "~/.cursor/hooks.json"
      - "~/.cursor/sandbox.json"
      - "**/.claude/settings.json"
      - "**/.claude/settings.local.json"
      - "**/.cursor/hooks.json"
      - "**/.cursor/sandbox.json"
      - "**/.codex/hooks.json"
      # OpenClaw: the state directory, its configuration (which loads OpenMoat's
      # plugin) and the plugin `moat init` writes; its workspace inside stays
      # writable, and its `.env` is `secrets-paths`' (`**/.env`)
      - "~/.openclaw"
      - "~/.openclaw/openclaw.json"
      - "~/.openclaw/openmoat"
      - "~/.openclaw/openmoat/**"
      # OpenClaw's control-plane database: its exec approvals, plugin state and the
      # cron jobs its Gateway runs (an OpenClaw `cron` add or update is decided as a
      # write of it), so an agent cannot approve its own commands there
      - "~/.openclaw/state/**"
      # GitHub Copilot CLI: its configuration directory, the hooks directory whose
      # every file it loads (OpenMoat's included), and the user and repository
      # settings whose `disableAllHooks` turns them all off; its session folders
      # stay writable
      - "~/.copilot"
      - "~/.copilot/hooks"
      - "~/.copilot/hooks/**"
      - "~/.copilot/settings.json"
      - "~/.copilot/config.json"
      - "**/.copilot"
      - "**/.copilot/hooks"
      - "**/.copilot/hooks/**"
      - "**/.copilot/settings.json"
      - "**/.copilot/config.json"
      - "**/.github/copilot/settings.json"
      - "**/.github/copilot/settings.local.json"
      # pi: the agent directory, OpenMoat's extension in it, the settings that
      # can turn the extension off and the trust decisions that load a project's
      # own extensions; other extensions ask (`runs-later`)
      - "~/.pi"
      - "~/.pi/agent"
      - "~/.pi/agent/extensions"
      - "~/.pi/agent/extensions/openmoat.js"
      - "~/.pi/agent/settings.json"
      - "~/.pi/agent/trust.json"
      # Gemini CLI: its directory, the settings that hold OpenMoat's hook (a
      # project's are merged over them and can turn hooks off) and the folder
      # trust list, which decides whether settings hooks run at all
      - "~/.gemini"
      - "**/.gemini"
      - "~/.gemini/settings.json"
      - "~/.gemini/trustedFolders.json"
      - "**/.gemini/settings.json"
      # OpenCode: its configuration directory, OpenMoat's plugin and the plugin
      # folders around it, the configuration files whose `plugin` list loads
      # plugins and whose `-openmoat` removes OpenMoat's (`config` is the old TOML
      # one OpenCode moves into `config.json`), and OpenCode 2's background service
      # settings, whose `env` it starts with; other plugins ask (`runs-later`)
      - "~/.config/opencode"
      - "~/.config/opencode/plugins"
      - "~/.config/opencode/plugins/openmoat.js"
      - "~/.config/opencode/plugin"
      - "~/.config/opencode/config.json"
      - "~/.config/opencode/opencode.json"
      - "~/.config/opencode/opencode.jsonc"
      - "~/.config/opencode/config"
      - "~/.config/opencode/service.json"
      - "~/.config/opencode/service*.json"
      # OpenCode also reads `~/.opencode` as a configuration directory, with its
      # own plugin folders and configuration files
      - "~/.opencode"
      - "~/.opencode/plugins"
      - "~/.opencode/plugin"
      - "~/.opencode/opencode.json"
      - "~/.opencode/opencode.jsonc"
      # Hermes Agent: its home: the `config.yaml` that holds OpenMoat's hook, the
      # hook allowlist without which a gateway, cron or ACP session skips it, the
      # `.env` that can set `HERMES_SAFE_MODE`, the sticky profile, the plugins and
      # hooks it runs in its own process, and the folder of its profiles (another
      # profile's files ask, `runs-later`; `HERMES_HOME` moves these to the one in use)
      - "~/.hermes"
      - "~/.hermes/config.yaml"
      - "~/.hermes/shell-hooks-allowlist.json"
      - "~/.hermes/.env"
      - "~/.hermes/active_profile"
      - "~/.hermes/plugins"
      - "~/.hermes/plugins/**"
      - "~/.hermes/hooks"
      - "~/.hermes/hooks/**"
      - "~/.hermes/agent-hooks"
      - "~/.hermes/agent-hooks/**"
      - "~/.hermes/profiles"
      - "**/.moat/**"
      # the binary every installed hook runs, by its name and by `moat`, the name it
      # had up to 0.7.0, which still runs it
      - "**/bin/moat"
      - "**/bin/moat.exe"
      - "**/bin/openmoat"
      - "**/bin/openmoat.exe"
      # Scoop: apps/<package>/current (the junction hooks run through) and each
      # apps/<package>/<version> it may point at (ADR-016)
      - "**/apps/moat/current"
      - "**/apps/moat/*/moat.exe"
      - "**/apps/openmoat/current"
      - "**/apps/openmoat/*/moat.exe"
      - "**/apps/openmoat/*/openmoat.exe"
    # each command by either name: `openmoat`, or `moat`, its name up to 0.7.0
    shell:
      - "{moat,openmoat} policy *"
      - "{moat,openmoat} init*"
      - "{moat,openmoat} doctor*"
      - "{moat,openmoat} allow*"
      - "{moat,openmoat} trust*"
      - "{moat,openmoat} edit*"
      - "*/{moat,openmoat} policy *"
      - "*/{moat,openmoat} init*"
      - "*/{moat,openmoat} doctor*"
      - "*/{moat,openmoat} allow*"
      - "*/{moat,openmoat} trust*"
      - "*/{moat,openmoat} edit*"
      - "{moat,openmoat} uninstall*"
      - "*/{moat,openmoat} uninstall*"
      - "{moat,openmoat} sandbox sync*"
      - "*/{moat,openmoat} sandbox sync*"
      # a service installed or removed runs or stops the proxy for every later session
      - "{moat,openmoat} proxy {install,uninstall}*"
      - "*/{moat,openmoat} proxy {install,uninstall}*"
      # a brokered secret's host is where its value goes
      - "{moat,openmoat} secret*"
      - "*/{moat,openmoat} secret*"
      # an audit anchor is the person's record of the log, kept outside it (ADR-031)
      - "{moat,openmoat} audit anchor*"
      - "*/{moat,openmoat} audit anchor*"
      # a changed or new MCP server, or a wrapped one, is a person's to accept (ADR-026)
      - "{moat,openmoat} mcp {accept,wrap,unwrap}*"
      - "*/{moat,openmoat} mcp {accept,wrap,unwrap}*"
      # pseudo-terminal wrappers that fake the terminal `allow`/`edit`/`secret`/`trust`/`uninstall`/`sandbox sync`/`doctor --accept`/`mcp accept` require
      # (`*moat` inside a quoted command line covers `openmoat` too)
      - "{script,*/script,unbuffer,tmux,*/tmux,screen,*/screen} * {moat,openmoat} sandbox sync*"
      - "{script,*/script,unbuffer,tmux,*/tmux,screen,*/screen} * */{moat,openmoat} sandbox sync*"
      - "script * {moat,openmoat} {allow,doctor,edit,init,mcp,policy,secret,trust,uninstall}*"
      - "script * */{moat,openmoat} {allow,doctor,edit,init,mcp,policy,secret,trust,uninstall}*"
      - "script * '*moat {allow,doctor,edit,init,mcp,policy,secret,trust,uninstall,sandbox*sync}*'"
      - "expect * '*moat {allow,doctor,edit,init,mcp,policy,secret,trust,uninstall,sandbox*sync}*'"
      - "unbuffer * {moat,openmoat} {allow,doctor,edit,init,mcp,policy,secret,trust,uninstall}*"
      - "unbuffer * */{moat,openmoat} {allow,doctor,edit,init,mcp,policy,secret,trust,uninstall}*"
      - "*/script * {moat,openmoat} {allow,doctor,edit,init,mcp,policy,secret,trust,uninstall}*"
      - "*/script * */{moat,openmoat} {allow,doctor,edit,init,mcp,policy,secret,trust,uninstall}*"
      - "*/script * '*moat {allow,doctor,edit,init,mcp,policy,secret,trust,uninstall,sandbox*sync}*'"
      - "*/expect * '*moat {allow,doctor,edit,init,mcp,policy,secret,trust,uninstall,sandbox*sync}*'"
      # Python's pty module, terminal multiplexers and macOS Terminal scripting (ADR-014)
      - "{python*,*/python*} * '*pty*spawn*(*moat*{allow,doctor,edit,init,mcp,policy,secret,trust,uninstall,sandbox*sync}*'"
      - "{tmux,*/tmux,screen,*/screen} * {moat,openmoat} {allow,doctor,edit,init,mcp,policy,secret,trust,uninstall}*"
      - "{tmux,*/tmux,screen,*/screen} * */{moat,openmoat} {allow,doctor,edit,init,mcp,policy,secret,trust,uninstall}*"
      - "{tmux,*/tmux,screen,*/screen} * '*moat {allow,doctor,edit,init,mcp,policy,secret,trust,uninstall,sandbox*sync}*'"
      - "{osascript,*/osascript} * '*moat {allow,doctor,edit,init,mcp,policy,secret,trust,uninstall,sandbox*sync}*'"
      # a bare `openmoat` or `moat` (the home screen asks to accept drift or approve an
      # ask) under the same wrappers; patterns are prefixes, so these deny any command
      # of either name run in them
      - "{script,*/script,unbuffer,*/unbuffer,tmux,*/tmux,screen,*/screen} * {moat,*/moat,openmoat,*/openmoat}"
      - "{script,*/script,tmux,*/tmux,screen,*/screen} * '{moat,*/moat,openmoat,*/openmoat}'*"
      - "{expect,*/expect} * '*spawn {moat,*/moat,openmoat,*/openmoat}{;,\n,'}*"
      - "{python*,*/python*} * '*pty*spawn*(*\"{moat,*/moat,openmoat,*/openmoat}\"{],)}*'"
      - "{osascript,*/osascript} * '*\"{moat,*/moat,openmoat,*/openmoat}\"*'"
      # reporting that an agent's plugin loaded (`guard --heartbeat`, ADR-042), which only
      # the plugins run, from inside their agent where no hook sees it; an agent that ran
      # it could hide that another agent's plugin never loaded
      - "{moat,*/moat,openmoat,*/openmoat} guard --heartbeat*"
      - "{moat,*/moat,openmoat,*/openmoat} guard * --heartbeat*"
      # stopping, disabling or masking the proxy service, which only `openmoat proxy
      # uninstall` removes: systemd's `moat-proxy` and launchd's `dev.openmoat.proxy`
      - "{systemctl,*/systemctl} * {stop,disable,mask,kill,edit,revert} * *moat-proxy*"
      - "{launchctl,*/launchctl} {bootout,unload,disable,remove,kill} * *dev.openmoat.proxy*"
      # starting OpenCode without its plugins, OpenMoat's among them (`--pure`, or
      # `OPENCODE_PURE` below), replacing the OpenCode the person runs with another
      # major version, whose plugin API OpenMoat's plugin must serve
      # (`upgrade --major`), changing the plugins of the global configuration, which
      # OpenCode 1 loads before OpenMoat's and OpenCode 2 lets remove it (OpenCode
      # 1's `plugin --global`; OpenCode 2's `plugin add`, `remove` and `update`), or
      # setting the environment OpenCode 2's background service starts with, which
      # can move its configuration away from OpenMoat's plugin (`service set env`)
      - "{opencode,*/opencode} * --pure*"
      - "{npx,*/npx,bunx,*/bunx,pnpx,*/pnpx} * opencode-ai* * --pure*"
      - "{opencode,*/opencode,opencode2,*/opencode2} upgrade * --major*"
      - "{opencode,*/opencode} {plugin,plug} * --global*"
      - "{opencode,*/opencode} {plugin,plug} * -g*"
      - "{opencode,*/opencode} {plugin,plug} * -[!-]*g*"
      - "{opencode,*/opencode,opencode2,*/opencode2} {plugin,plug} {add,remove,update}"
      - "{opencode,*/opencode,opencode2,*/opencode2} service {set,unset}"
      # Hermes Agent's own commands that take OpenMoat's hook out of `config.yaml` or
      # its allowlist (a running gateway drops it within a minute), turn approvals off,
      # enable plugins, set `HERMES_SAFE_MODE`, or make a profile without the hook the
      # one later sessions use
      - "{hermes,*/hermes} config set {hooks,approvals,plugins,HERMES_SAFE_MODE}*"
      - "{hermes,*/hermes} * config set {hooks,approvals,plugins,HERMES_SAFE_MODE}*"
      - "{hermes,*/hermes} hooks revoke*"
      - "{hermes,*/hermes} * hooks revoke*"
      - "{hermes,*/hermes} profile use*"
      - "{hermes,*/hermes} * profile use*"
    # `OPENCODE_PURE` starts OpenCode without its plugins, and `HERMES_SAFE_MODE`
    # starts Hermes Agent with no shell hook, OpenMoat's included in both;
    # `OPENCODE_CONFIG_DIR` moves OpenCode 2's configuration directory away from
    # OpenMoat's plugin (and adds one with plugins of its own to OpenCode 1), and
    # `OPENCODE_CONFIG` and `OPENCODE_CONFIG_CONTENT` add configuration whose
    # `-openmoat` removes the plugin in OpenCode 2
    env.set: ["OPENCODE_PURE", "HERMES_SAFE_MODE", "OPENCODE_CONFIG_DIR", "OPENCODE_CONFIG",
      "OPENCODE_CONFIG_CONTENT"]
  # the folders above a file `kernel-self` protects that hold no agent directory of
  # their own: renaming `.github` (or `.github/copilot`) away and back edits
  # `.github/copilot/settings.json` under another name. `hook_only` (ADR-034): a
  # sandboxed command may still create a `.github` (a clone, a package that has one)
  - id: agent-folders
    reason: renaming or removing this folder moves agent settings OpenMoat protects
    hook_only: true
    fs.write: ["**/.github", "**/.github/copilot"]
  - id: shell-rc
    reason: edits persist into every future shell session
    # the login and logout files, the other shells' startup files (fish, csh, tcsh,
    # ksh, mksh) and the drop-in folders many rc files source, which run on the
    # same schedule; and the files curl and wget read on every run, which can add
    # a body or an upload to each later call (`data = @~/.ssh/id_rsa`):
    # `~/.config/wget/` is wget2's
    fs.write: ["~/.zshrc", "~/.bashrc", "~/.bash_profile", "~/.profile", "~/.zprofile", "~/.zshenv",
      "~/.zlogin", "~/.zlogout", "~/.bash_login", "~/.bash_logout", "~/.bashrc.d/**", "~/.zshrc.d/**",
      "~/.config/fish/config.fish", "~/.config/fish/conf.d/**", "~/.config/fish/functions/**",
      "~/.login", "~/.cshrc", "~/.tcshrc", "~/.kshrc", "~/.mkshrc",
      "~/.curlrc", "~/_curlrc", "~/.config/curlrc", "~/.wgetrc", "~/.config/wget/**"]
  - id: cloud-metadata
    reason: instance metadata and link-local services hand out cloud credentials
    # a `net` deny also covers `fetch` (ADR-017), so a fetch tool cannot read them either
    net: ["169.254.*", "fe80:*", "fd00:ec2::254", "100.100.100.200", "metadata.google.internal", "metadata.goog"]
  - id: token-egress
    reason: sends a known kind of token to a host that is not its service's
    # `@token-egress <service> <host>` atoms: a GitHub, OpenAI/Anthropic, AWS, Slack,
    # Google, npm or GitLab token in a URL, a web search, or the arguments of a
    # command that connects to a host (POLICY.md §3)
    shell: ["@token-egress *"]
  - id: placeholder-egress
    reason: sends a brokered secret's placeholder to a host the proxy does not put that secret in
    # `@placeholder-egress <id> <host>` atoms: `moat-secret:<id>:placeholder` going
    # anywhere but the secret's `host` (POLICY.md §2.1)
    shell: ["@placeholder-egress *"]
  - id: encoded-egress
    reason: sends a long encoded value in a URL after the session read secret material
    # `@encoded-egress <host>` atoms, added only once the session read a secret: a URL a
    # fetch, browser or MCP tool opens that carries 80 or more characters of base64 or
    # hex (POLICY.md §4.1, ADR-047)
    shell: ["@encoded-egress *"]

allow:
  - id: project-fs
    # the root itself too: a search with no path reads the whole project
    fs.read: ["${project}", "${project}/**"]
    # a `.git` at any depth is a repository git follows (a `gitdir:` file, a planted
    # directory), so writing one asks like the root's own `.git`
    fs.write: ["${project}/**", "!${project}/.git/**", "!${project}/**/.git/**", "!${project}/.moat/**",
      # what CI, a commit or the agent host runs later, outside any sandbox (`runs-later` asks)
      "!${project}/**/.github/workflows/**", "!${project}/**/.gitlab-ci.yml", "!${project}/**/.circleci/**", "!${project}/**/azure-pipelines.yml", "!${project}/**/Jenkinsfile", "!${project}/**/.buildkite/**", "!${project}/**/.husky/**", "!${project}/**/.pre-commit-config.yaml", "!${project}/**/lefthook.yml", "!${project}/**/.lefthook.yml", "!${project}/**/.vscode/tasks.json",
      "!${project}/**/.claude/hooks/**", "!${project}/**/.mcp.json", "!${project}/**/.cursor/mcp.json", "!${project}/**/.codex/config.toml",
      "!${project}/**/.openclaw/extensions/**", "!${project}/**/.github/hooks/**", "!${project}/**/.github/mcp.json",
      "!${project}/**/.pi/extensions/**", "!${project}/**/.pi/mcp.json", "!${project}/**/.pi/settings.json",
      # the folders above them, which a rename moves with everything inside (`runs-later` asks)
      "!${project}/**/.github/hooks", "!${project}/**/.pi", "!${project}/**/.pi/extensions",
      "!${project}/**/.gemini/policies/**", "!${project}/**/.gemini/commands/**", "!${project}/**/.gemini/agents/**",
      "!${project}/**/.github/agents/**", "!${project}/**/.claude/agents/**", "!${project}/**/.claude/skills/**",
      "!${project}/**/.claude/commands/**",
      "!${project}/**/.opencode/plugins/**", "!${project}/**/.opencode/plugin/**", "!${project}/**/.opencode/tools/**",
      "!${project}/**/.opencode/tool/**", "!${project}/**/.opencode/commands/**", "!${project}/**/.opencode/command/**",
      "!${project}/**/.opencode/opencode.json", "!${project}/**/.opencode/opencode.jsonc", "!${project}/**/.opencode/package.json",
      "!${project}/**/opencode.json", "!${project}/**/opencode.jsonc",
      "!${project}/**/.opencode", "!${project}/**/.opencode/plugins", "!${project}/**/.opencode/plugin",
      "!${project}/**/.hermes/plugins/**", "!${project}/**/.hermes", "!${project}/**/.hermes/plugins",
      # what every Python start runs, a project's `.venv` included
      "!${project}/**/site-packages/*.pth", "!${project}/**/dist-packages/*.pth",
      "!${project}/**/sitecustomize.py", "!${project}/**/usercustomize.py"]
  # Claude Code's own temporary folder (`/tmp/claude-<uid>/`): the output of the
  # agent's background commands, which it reads back with `cat`
  - id: agent-temp
    fs.read: ["/tmp/claude-*/**", "/private/tmp/claude-*/**"]
  - id: dev-shell
    shell:
      - "git status*"
      - "git diff*"
      - "git log*"
      - "git show*"
      - "git branch*"
      - "git add *"
      - "git commit *"
      - "git checkout *"
      - "git switch *"
      - "git fetch*"
      - "git pull*"
      - "git rebase *"
      - "git merge *"
      # each path is an fs.write atom, so `.git`, `.moat` and hook settings ask or deny
      - "git restore *"
      - "git stash*"
      # read-only subcommands; only the forms that print are listed
      - "git ls-files*"
      - "git ls-tree *"
      - "git rev-parse *"
      - "git rev-list *"
      - "git merge-base *"
      - "git cat-file *"
      - "git blame *"
      - "git grep *"
      - "git describe*"
      - "git shortlog*"
      - "git check-ignore *"
      - "git worktree list*"
      - "git reflog $"
      - "git reflog show*"
      # listing tags; a list option makes any further word a pattern, and git refuses
      # to combine it with creating, deleting or verifying
      - "git tag $"
      - "git tag {-l,--list,--contains,--no-contains,--merged,--no-merged,--points-at}"
      - "git tag -n*"
      # `git remote show` and `git remote update` contact the remote
      - "git remote $"
      - "git remote {-v,--verbose} $"
      - "git remote get-url *"
      # reading config: git takes options only before the first name, so the read
      # action must come first, after at most one scope option or the file it reads;
      # git refuses a second action, so no write can follow
      - "git config {--get,--get-all,--get-regexp,--list,-l}"
      - "git config {--global,--local,--system,--worktree,--show-origin,--show-scope,--null,-z,--name-only,--includes} {--get,--get-all,--get-regexp,--list,-l}"
      - "git config {-f,--file,--blob} ?* {--get,--get-all,--get-regexp,--list,-l}"
      - "git config {--file=*,--blob=*} {--get,--get-all,--get-regexp,--list,-l}"
      - "git config {get,list}"
      - "ls*"
      - "cat *"
      - "head *"
      - "tail *"
      - "grep *"
      - "rg *"
      - "find *"
      - "pwd"
      - "echo *"
      - "which *"
      - "printf *"
      # `command -v`/`-V` and `type` only print how a name resolves
      - "command -v *"
      - "command -V *"
      - "type *"
      - "true"
      - "jq *"
      # moving around and everyday file operations; every path operand is also an
      # fs atom (resolved through cd and symlinks), so outside the project these ask
      - "cd"
      - "cd *"
      - "pushd *"
      - "popd"
      - "mkdir *"
      - "touch *"
      - "cp *"
      - "mv *"
      - "rm *"
      - "npm test*"
      - "npm run *"
      - "pnpm test*"
      - "pnpm run *"
      - "pnpm build*"
      - "pnpm lint*"
      - "pnpm typecheck*"
      - "pnpm exec *"
      - "yarn exec *"
      - "yarn test*"
      - "yarn run *"
      - "yarn build*"
      - "yarn lint*"
      - "cargo build*"
      - "cargo test*"
      - "cargo check*"
      - "cargo clippy*"
      - "cargo fmt*"
      - "cargo run*"
      - "cargo doc*"
      - "cargo bench*"
      - "cargo nextest*"
      - "cargo tree*"
      - "cargo metadata*"
      - "go test*"
      - "go build*"
      - "go vet*"
      - "swift test*"
      - "swift build*"
      - "pytest*"
      - "python -m pytest*"
      - "python3 -m pytest*"
      # the directory operands are fs.write atoms, so outside the project these ask
      - "python -m venv *"
      - "python3 -m venv *"
      # the project's own virtual environment, as written: any other spelling or file asks
      - "source .venv/bin/activate $"
      - ". .venv/bin/activate $"
      - "source venv/bin/activate $"
      - ". venv/bin/activate $"
      - "make $"
      - "make test*"
      - "make build*"
      - "make check*"
      - "make lint*"
      # other ecosystems' build and test commands run the project's own code, like
      # `cargo test`; paths in their arguments are fs atoms, so outside the project
      # these ask
      - "mvn {test,compile,package,verify}"
      - "{./gradlew,gradle} {test,build,check}"
      - "dotnet {build,test,run}"
      - "bundle exec rspec"
      - "rspec"
      - "rake test"
      - "php artisan test"
      - "phpunit"
      - "cmake {-B,-S}*"
      - "cmake --build *"
      - "ctest"
      - "terraform {fmt,validate}"
      - "swift run*"
      # a module path or version (`go run x@latest`) downloads code: only local packages
      - "go run {.,./*,*.go}"
      # a project script: the script is an fs.read atom, resolved through symlinks
      - "{python,python3} *.py"
      # options that only change buffering, bytecode or which paths Python trusts,
      # each a word of its own: `-Ic` would run code
      - "{python,python3} {-I,-u,-B,-E,-s,-S,-O} *.py"
      - "{python,python3} {-I,-u,-B,-E,-s,-S,-O} {-I,-u,-B,-E,-s,-S,-O} *.py"
      - "node *.{js,mjs,cjs}"
      # the wrapped command is classified on its own (`uv run pytest` is also `pytest`)
      - "uv run *"
      # the build runs in a container; the options that reach the host are excluded
      - "docker build *"
      # options that run another program or write outside the command's own output (ADR-012)
      # a recursive removal is judged by the paths it writes: a project subdirectory is
      # allowed, `.git`, `~` and anything outside ask or deny. `project-fs` also allows
      # the root itself, so a recursive removal asks for every spelling that may name
      # it: `.`, an absolute or home path, a variable, `..`, and an unexpanded `*` or
      # `.*` (every entry). Checkouts that discard uncommitted work stay at ask
      - "!rm * -*[rR]* * {.,./,/*,~*,$*,*..*,[*],./[*],.[*],./.[*]}"
      - "!rm * {.,./,/*,~*,$*,*..*,[*],./[*],.[*],./.[*]} * -*[rR]*"
      - "!git restore * {.,./,[*],:*}"
      - "!git restore * --pathspec-f*"
      - "!git checkout * ."
      - "!git checkout * -- *"
      - "!git checkout * -f*"
      - "!git checkout * --force*"
      # `printf -v NAME` assigns a variable instead of printing
      - "!printf -v*"
      - "!find * -exec*"
      - "!find * -ok*"
      - "!find * -delete*"
      - "!find * -fprint*"
      - "!find * -fls*"
      - "!rg * --pre"
      - "!rg * --pre=*"
      - "!git * --upload-pack*"
      - "!git * --receive-pack*"
      - "!go * -exec*"
      - "!go * -toolexec*"
      - "!go * -vettool*"
      - "!cargo * --config*"
      # a `plugin:goal` (`exec:exec`, `antrun:run`) runs what the command line names
      - "!mvn * *:*"
      # msbuild switches written `-switch:value` load loggers or write files the
      # command line does not show as paths; `@file` reads more switches from a file
      - "!dotnet * -*:*"
      - "!dotnet * @*"
      # `-e`/`-p`/`--execute*` run Ruby from the command line; `-g`/`--system` load ~/.rake
      - "!rake * -[eEpg]*"
      - "!rake * -[!-]*[eEpg]*"
      - "!rake * --e*"
      - "!rake * --sy*"
      # `cmake -E` runs a built-in command (`cmake -E rm -rf …`), `-P` a script; words
      # after `--` go to the native build tool (`make --eval`)
      - "!cmake * -[EP]*"
      - "!cmake * --"
      # dashboards submit results over the network; scripts and `--build-and-test` run commands
      - "!ctest * -[DMTS]*"
      - "!ctest * --{dashboard,build-*,test-command,script*,extra-submit,submit-index}*"
      - "!go run * *@*"
      # `--with` installs more packages into the run
      - "!uv run * --with*"
      # build secrets, the SSH agent, host networking and entitlements, output written
      # to the host, extra build contexts, and pushes reach beyond the container
      - "!docker build * --{secret,ssh,build-context,net,allow,security-opt,output,push,cache-to}*"
      - "!docker build * -o*"
      - "!docker build * -[!-]*o*"
      # rebase options that run commands (`--exec`, `-x`), open the todo list
      # (`--interactive`, `-i`, `--edit-todo`), resume a todo list that may hold `exec`
      # lines (`--continue`, `--skip`) or run a `git-merge-<name>` program (`--strategy`,
      # `-s`); git takes an unambiguous prefix of a long option, so `--ex*` is `--exec`
      - "!git rebase * --ex*"
      - "!git rebase * --in*"
      - "!git rebase * --ed*"
      - "!git rebase * --con*"
      - "!git rebase * --sk*"
      - "!git rebase * --str*"
      - "!git rebase * -[ixs]*"
      - "!git rebase * -[!-]*[ixs]*"
      # a merge strategy other than the built-in ones runs a `git-merge-<name>` program
      - "!git merge * --str*"
      - "!git merge * -s*"
      - "!git merge * -[!-]*s*"
      # deleting a branch by force drops commits only the reflog keeps: `destructive-recoverable` asks
      - "!git branch -D *"
      - "!git branch --delete --force *"
      - "!git branch --force --delete *"
      - "!git branch -d -f *"
      - "!git branch -f -d *"
      - "!git branch -df *"
      - "!git branch -fd *"
      # options that run a program: a pager to open matches in (`-O`), and the textconv
      # or filter drivers that `--textconv` and `--filters` turn on; any prefix git
      # accepts (`--op*`, `--te*`/`--t*`, `--fi*`)
      - "!git grep * -O*"
      - "!git grep * -[!-]*O*"
      - "!git grep * --op*"
      - "!git grep * --te*"
      - "!git cat-file * --t*"
      - "!git cat-file * --fi*"
      - "!git blame * --t*"
      # venv `--clear` empties an existing directory, `--upgrade-deps` downloads
      # packages; argparse also takes a prefix of a long option
      - "!python* -m venv * --cl*"
      - "!python* -m venv * --u*"
  - id: dev-readonly
    reason: read-only inspection tools and non-secret variables
    shell:
      - "wc *"
      - "diff *"
      - "tree*"
      # their operands are fs.read atoms, so outside the project these ask
      - "file *"
      - "stat *"
      - "du *"
      - "fd *"
      - "uname"
      # printing the date; setting the clock (`date -s`, `date MMDDhhmm`) asks
      - "date $"
      - "date +* $"
      - "date {-u,--utc} $"
      - "date {-u,--utc} +* $"
      - "brew {list,ls,info,search,config,--version}"
      - "java {-version,--version} $"
      # a toolchain's version, the first thing an agent checks; only these names, so a
      # program the agent wrote (`./tool --version`) still asks
      - "{git,node,npm,pnpm,yarn,deno,bun,python,python3,pip,pip3,uv,ruby,gem,bundle,cargo,rustc,rustup,go,gcc,g++,clang,cmake,make,docker,kubectl,terraform,dotnet,mvn,gradle,swift,php,composer,perl} {--version,-V} $"
      - "{node,npm,pnpm,yarn,deno,bun} -v $"
      - "{git,go,docker,dotnet} version $"
      # git's own options are parsed away (`git --version` is also seen as `git`); a bare
      # `git` prints its usage, and an option that changes what git runs keeps the
      # command as written, which must match on its own (shell/git.rs)
      - "git $"
      - "docker ps*"
      - "docker images*"
      - "docker logs *"
      - "docker version*"
      - "gh pr view*"
      - "gh pr list*"
      - "gh pr diff*"
      - "gh pr checks*"
      - "gh issue view*"
      - "gh issue list*"
      - "gh run list*"
      - "gh run view*"
      - "gh repo view*"
      - "!* --output*"
      - "!* -o *"
      # `fd -x/-X/--exec*` run a program per match; `file -C` writes a compiled
      # magic file and `file -f` reads the names to check from a file
      - "!fd * -[xX]*"
      - "!fd * -[!-]*[xX]*"
      - "!fd * --exec*"
      - "!file * -[Cf]*"
      - "!file * -[!-]*[Cf]*"
      - "!file * --{c,f}*"
    env.read: ["PATH", "HOME", "USER", "SHELL", "PWD", "LANG", "TERM", "TMPDIR", "EDITOR"]
  # a lowercase shell variable (`for f in`, `n=3`): environment variables, secrets
  # among them, are uppercase by convention; the lowercase ones programs do read,
  # the proxy variables of curl and git and npm's `npm_config_*`, stay out
  - id: shell-locals
    env.set: ["[a-z_]*", "![a-z_]*[!a-z0-9_]*", "!*_proxy", "!no_proxy", "!npm_config_*"]
  - id: dev-tools
    shell:
      - "tsc*"
      - "eslint *"
      - "prettier *"
      - "biome *"
      - "vitest*"
      - "jest*"
      - "mocha*"
      - "ruff *"
      - "black *"
      - "mypy *"
      - "golangci-lint*"
      # `gofmt -w` rewrites its operands and `-cpuprofile` writes a file: fs.write atoms
      - "gofmt *"
  - id: text-tools
    reason: read-only text tools; the classifier reads their options and scripts (shell/text.rs)
    shell:
      - "sed *"
      - "awk *"
      - "sort *"
      - "uniq *"
      - "cut *"
      # reads only stdin and writes only stdout; its operands are character sets
      - "tr *"
      # `perl -pi -e 's/a/b/' FILE…` whose program is only substitutions without the
      # `e` flag (shell/in_place.rs): the files are fs.write atoms, as for `sed -i`
      - "perl @substitute *"
      # what the classifier cannot prove read-only is reported as `<program> @<argument>`
      - "!{sed,awk,sort,uniq,cut} @*"
  - id: registries
    net:
      - "api.github.com"
      - "github.com"
      - "registry.npmjs.org"
      - "crates.io"
      - "static.crates.io"
      - "index.crates.io"
      - "proxy.golang.org"
      - "pypi.org"
      - "files.pythonhosted.org"
  - id: safe-mcp
    mcp: ["mcp__github__search_*", "mcp__github__get_*", "mcp__filesystem__read_*", "mcp__filesystem__list_*"]

# OpenMoat asks itself only where the effect outlives the sandbox or the session:
# what git, the login session or a build runs later, outside any sandbox, and reads
# that sweep up secrets. Normal work never meets these (ADR-025).
ask:
  - id: git-internals
    reason: git runs what its config, hooks and refs name, later and outside any sandbox
    # a `.git` at any depth is a repository git follows (a `gitdir:` file, a planted directory)
    fs.write: ["${project}/.git", "${project}/.git/**", "${project}/**/.git", "${project}/**/.git/**"]
    # `dev-shell` allows the forms that only read; the rest of these change what git runs.
    # A `-c` key that never names a program is dropped from the atom (shell/git.rs), so
    # `git -c user.name=x commit` matches `git commit`. `git init --template=DIR` copies
    # DIR's hooks into the new repository; an empty `--template=` copies none
    shell: ["git config *", "git remote *", "git -c *", "git --config-env*", "git --git-dir*", "git --work-tree*", "git --exec-path*",
      "git init --template=?*", "git init --template ?*", "git init * --template=?*", "git init * --template ?*"]
  # deleting a local branch loses nothing the reflog does not keep for weeks, so it
  # asks where a force push or `reset --hard` is denied
  - id: destructive-recoverable
    reason: deletes local work that the reflog still holds for a while
    shell: ["git branch -D *", "git branch --delete --force *", "git branch --force --delete *",
      "git branch -d -f *", "git branch -f -d *", "git branch -df *", "git branch -fd *"]
  # CI configuration runs with the repository's secrets once a branch is pushed, and
  # commit-hook managers and editor tasks run on this machine outside any sandbox;
  # so do the agent hosts' hook scripts, MCP server lists and Codex's project config,
  # in the next session. `project-fs` leaves them out, so a write asks wherever it is.
  # Hook only: the OS sandboxes list them as writable (`sandbox/patterns.rs`), and the
  # home files are the hosts' own state, which `moat run --write` may grant
  - id: runs-later
    reason: CI, commit hooks, the editor or the agent host run this later, outside any sandbox
    fs.write: ["**/.github/workflows/**", "**/.gitlab-ci.yml", "**/.circleci/**", "**/azure-pipelines.yml", "**/Jenkinsfile", "**/.buildkite/**", "**/.husky/**", "**/.pre-commit-config.yaml", "**/lefthook.yml", "**/.lefthook.yml", "**/.vscode/tasks.json",
      "**/.claude/hooks/**", "**/.mcp.json", "**/.cursor/mcp.json", "**/.codex/config.toml",
      "~/.claude.json", "~/.claude/plugins/**", "~/.cursor/mcp.json", "~/.cursor/cli-config.json",
      # OpenClaw plugins, which its Gateway loads and runs with the agent's rights
      "~/.openclaw/extensions/**", "**/.openclaw/extensions/**",
      # GitHub Copilot CLI: a repository's hook files and MCP servers, and the user's MCP servers,
      # plugins and custom agents (whose frontmatter may carry hooks)
      "**/.github/hooks/**", "**/.github/mcp.json",
      "~/.copilot/mcp-config.json", "~/.copilot/installed-plugins/**", "~/.copilot/agents/**",
      # pi extensions, which pi loads and runs with the agent's rights, its MCP
      # server lists, and a project's pi settings, which can add packages and turn
      # extensions off
      "~/.pi/agent/extensions/**", "**/.pi/extensions/**", "~/.pi/agent/mcp.json", "**/.pi/mcp.json",
      "**/.pi/settings.json",
      # the folders above a repository's Copilot hooks and its pi files: a rename away
      # and back edits them under another name
      "**/.github/hooks", "**/.pi", "**/.pi/extensions",
      # Gemini CLI extensions, whose hooks and MCP servers it starts; its policy
      # files, which can allow what OpenMoat leaves to it (accepted without a
      # question in a non-interactive run); its custom commands, whose shell
      # runs when the person types the command, outside any tool hook; and its
      # subagents
      "~/.gemini/extensions/**", "**/.gemini/policies/**", "~/.gemini/policies/**",
      "**/.gemini/commands/**", "**/.gemini/agents/**",
      # a repository's GitHub Copilot CLI agents, whose frontmatter may carry hooks
      "**/.github/agents/**",
      # Claude Code subagents, skills and slash commands, which carry their own
      # hooks, allowed tools and shell
      "**/.claude/agents/**", "**/.claude/skills/**", "**/.claude/commands/**",
      # OpenCode plugins and custom tools, which it loads into its own process with
      # the agent's rights (a project's at start, with no prompt); its commands,
      # whose `` !`…` `` shell runs when the person types the command; a project's
      # configuration, which adds plugins, MCP servers and permission rules; and the
      # package files and caches it loads plugin code from
      "~/.config/opencode/plugins/**", "~/.config/opencode/plugin/**",
      "~/.config/opencode/tools/**", "~/.config/opencode/tool/**",
      "~/.config/opencode/commands/**", "~/.config/opencode/command/**",
      "~/.config/opencode/package.json", "~/.config/opencode/node_modules/**",
      "~/.cache/opencode/node_modules/**",
      "**/.opencode/plugins/**", "**/.opencode/plugin/**", "**/.opencode/tools/**", "**/.opencode/tool/**",
      "**/.opencode/commands/**", "**/.opencode/command/**", "**/.opencode/opencode.json",
      "**/.opencode/opencode.jsonc", "**/.opencode/package.json", "**/opencode.json", "**/opencode.jsonc",
      # the folders above a project's OpenCode plugins: a rename away and back edits them
      "**/.opencode", "**/.opencode/plugins", "**/.opencode/plugin",
      # Hermes Agent: the cron jobs it runs later unattended and the skills it loads
      # into later sessions; another profile's configuration, hook allowlist,
      # `.env`, plugins, hooks, skills and cron jobs, which run when that profile is
      # used; and a project's plugins (loaded with `HERMES_ENABLE_PROJECT_PLUGINS`),
      # with the folders above them
      "~/.hermes/cron/**", "~/.hermes/skills/**",
      "~/.hermes/profiles/*/config.yaml", "~/.hermes/profiles/*/shell-hooks-allowlist.json",
      "~/.hermes/profiles/*/.env", "~/.hermes/profiles/*/plugins/**", "~/.hermes/profiles/*/hooks/**",
      "~/.hermes/profiles/*/agent-hooks/**", "~/.hermes/profiles/*/skills/**", "~/.hermes/profiles/*/cron/**",
      "**/.hermes/plugins/**", "**/.hermes", "**/.hermes/plugins",
      # the Continue CLI's configuration, whose `mcpServers` it starts
      "~/.continue/config.yaml",
      # what every Python start runs, the allowed `pytest` included: a `.pth`
      # file in a site directory (a line starting `import` is executed) and
      # `sitecustomize`/`usercustomize`, imported from any folder on `sys.path`
      "**/site-packages/*.pth", "**/dist-packages/*.pth", "**/sitecustomize.py", "**/usercustomize.py"]
    shell:
      # `opencode plugin` adds a plugin to the project's configuration (with
      # `--global`, which `kernel-self` denies, to the person's)
      - "{opencode,*/opencode} {plugin,plug}*"
      # the agents' own commands that save an MCP server, which the agent starts
      # in every later session, turn a defined one on, or start a server's OAuth
      # sign-in, which opens the address the server names (Codex's `mcp add
      # --url` and OpenCode's `mcp debug` start one too); listing and showing
      # servers stays as it was
      - "{claude,*/claude} mcp {add*,login*}"
      - "{claude,*/claude} plugin install*"
      - "{codex,*/codex} mcp {add*,login*}"
      - "{agent,*/agent,cursor-agent,*/cursor-agent} mcp {enable*,login*}"
      - "{openclaw,*/openclaw} mcp {add*,set*,configure*,login*}"
      - "{copilot,*/copilot} mcp {add*,enable*}"
      - "{pi,*/pi} mcp {add*,login*}"
      - "{gemini,*/gemini} mcp {add*,enable*}"
      - "{gemini,*/gemini} extensions {install*,link*}"
      - "{opencode,*/opencode,opencode2,*/opencode2} mcp {add*,auth*,debug*}"
      - "{hermes,*/hermes} mcp $"
      - "{hermes,*/hermes} mcp {add*,install*,picker*,configure*,login*,reauth*}"
      - "{hermes,*/hermes} * mcp {add*,install*,picker*,configure*,login*,reauth*}"
  - id: persistence
    reason: runs again later, outside this session
    fs.write: ["~/Library/LaunchAgents/**", "~/.gitconfig", "~/.config/git/**", "~/.config/autostart/**", "~/.config/systemd/user/**",
      # folders on `PATH`: a file named after `git`, `ls` or `node` there runs in
      # its place later, with the person's rights. Installers (`pipx`, `cargo
      # install`, `brew`) are commands, not writes, and keep their verdict;
      # `kernel-self` denies OpenMoat's own binary names in any `bin`
      "~/.local/bin/**", "~/bin/**", "~/.cargo/bin/**", "/usr/local/bin/**", "/opt/homebrew/bin/**"]
    # `at` and `batch` run the job on their stdin or in `-f FILE` later; the job's
    # commands are classified too, so a denied one stays denied
    shell: ["crontab *", "at *", "batch *"]
  - id: stops-openmoat
    reason: stops a running OpenMoat process, such as the egress proxy service
    # `@kills <name>` atoms: a `pkill` or `killall` pattern that could match the
    # process name `openmoat` or `moat`, read as the regular expression it is
    # (`pkill -f 'open.*'`, `killall moat`; not `pkill -f my-server.js`, shell/kills.rs);
    # and `kill` of the pids a substitution names (`kill $(pgrep openmoat)`): its
    # atom carries the substitution's text in place of `$(…)`
    shell:
      - "@kills *moat*"
      - "{kill,*/kill} * *moat*"
  - id: home-sweep
    reason: reads the whole home folder, secrets included
    # the folder itself: a recursive read of an ancestor of the guarded paths (POLICY.md §3)
    fs.read: ["~", "~/.config"]
  - id: other-home
    reason: names another user's home, which OpenMoat cannot place
    # `@other-home <word>` atoms: `~alice/.ssh/id_rsa` may hold that user's secrets
    shell: ["@other-home *"]
  - id: secret-names
    reason: names a secret's file in a directory OpenMoat cannot see
    # `@unknown-path <word>` atoms: a path through a variable whose value is not known
    # (`cat $X/id_rsa`); its file name is that of a key, a token or a `.env`
    shell:
      - "@unknown-path *{id_rsa,id_dsa,id_ecdsa,id_ed25519}"
      - "@unknown-path *{id_rsa,id_dsa,id_ecdsa,id_ed25519}.pub"
      - "@unknown-path *{.env,.envrc,.netrc,.npmrc,.pypirc,.git-credentials,credentials}"
      - "@unknown-path *.env.*"
      - "@unknown-path *.{pem,key,p12,pfx}"
  - id: opaque-code
    reason: a program OpenMoat cannot read may open any file or variable
    # `<program> @<text>` atoms: an awk or sed program, or a text-tool option, not understood
    # and `<shell> @stdin`: text piped into a shell that the command line does not show;
    # `@opaque-code <interpreter>`: inline code (`python3 -c`, `node -e`, a here-document)
    # that opens files, connects, reads the environment or runs programs with text it
    # builds at run time, so the scan cannot see what it opens
    shell: ["awk @*", "gawk @*", "mawk @*", "nawk @*", "sed @*", "gsed @*", "sort @*", "uniq @*", "cut @*", "printf -v *", "{sh,bash,zsh,dash,ksh,fish} @stdin", "@opaque-code *"]
    env.set: ["CDPATH"]
  # `@package-near-miss <ecosystem> <name> <popular>` atoms (ADR-030): an install of a
  # name that is not on the bundled list of popular packages but is one typo or a
  # common trick away from one on it. Other installs defer, unknown names included
  - id: package-near-miss
    reason: looks like a typo of a popular package's name, as typo-squats and made-up names do; check which one you meant
    shell: ["@package-near-miss *"]
  - id: docker-secrets
    reason: hands secrets, the SSH agent or the host to a build
    # `dev-shell` allows `docker build` without these options
    shell: ["docker build *"]
  # `claude setup-token` signs in and prints a new long-lived login token
  # without saving it; the person may mean to (a CI secret), the agent should
  # not do it unasked. Commands that print a stored token are denied
  # (`agent-credentials`)
  - id: agent-token
    reason: makes a new login token for an AI agent and prints it
    shell: ["{claude,*/claude} setup-token*"]

# Installs, publishing and pushes are not listed: they match no rule, so the agent's
# own prompt decides them like any other unlisted call (ADR-025).
defer:
  # without this group the `net` default would deny local services
  - id: local-net
    reason: local service; may expose a control API (Docker, databases, cloud agents)
    net: ["localhost", "127.0.0.1", "::1"]

executables: {}

# What the host sandboxes OpenMoat configures (ADR-018) may read beyond the project:
# system and toolchain locations every build reads. Only OS layers use this list;
# the hook still applies the rules above to these reads (defer), and secrets-paths
# still wins inside them. Writes stay project-only. Missing paths are harmless.
sandbox:
  # `moat run` tells npm and uv to install no version published in the last 7 days
  # (ADR-030); 0 turns it off
  package_min_release_age_days: 7
  read_roots:
    - /usr
    - /bin
    - /sbin
    - /lib
    - /lib64
    - /etc
    - /opt
    - /nix
    - /snap
    - /System
    - /Library
    - /Applications/Xcode.app
    - /private/etc
    - /tmp
    - /private/tmp
    - /var/folders
    - /private/var/folders
    - ~/.gitconfig
    - ~/.cargo
    - ~/.rustup
    - ~/.npm
    - ~/.nvm
    - ~/.pyenv
    - ~/.local/bin
    - ~/go
