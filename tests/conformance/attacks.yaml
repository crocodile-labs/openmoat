  threat: T7
  action: { shell: "cat ~/.ssh/id_rsa; cat <<EOF\nnever closed" }
  expect: { verdict: deny, rules: [secrets-paths] }
- id: T7-deny-inside-an-unterminated-heredoc-run-by-sh
