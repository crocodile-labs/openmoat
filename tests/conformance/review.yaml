  expect: { verdict: review, rules: [unparseable] }
- id: review-glob-component-that-does-not-compile
  threat: T1
  action: { shell: "cat notes[*" }
  files: ["/p/notes[1]"]
  expect: { verdict: review, rules: [unparseable] }
# A glob that names more than can be listed (here `**` past its depth bound)
# may name a secret no atom checks: the call needs review, never the
# catch-all's `defer` or an allow from the files that were listed.
- id: review-glob-past-the-expansion-limit
  threat: T1
  action: { shell: "cat **/x" }
  files: ["/p/d/d/d/d/d/d/d/d/d/x"]
  expect: { verdict: review, rules: [unparseable] }
- id: review-unbalanced-paren
  threat: T7
  action: { shell: "cd /tmp ) ; cat notes.txt" }
  expect: { verdict: defer, rules: [default, unparseable] }
- id: review-heredoc-through-tee-into-shell
  threat: T7
  action: { shell: "cat <<'EOF' | tee log | sh\ncat ~/.ssh/id_rsa\nEOF" }
  expect: { verdict: review, rules: [opaque-code] }
- id: review-nesting-too-deep
  threat: T7
  action: { shell: "echo $(echo $(echo $(echo $(echo $(echo hi)))))" }
  expect: { verdict: review, rules: [unparseable] }
- id: review-empty-command
  threat: T7
  action: { shell: "   " }
  expect: { verdict: defer, rules: [unparseable] }
- id: review-powershell-is-never-classified
  threat: T7
  action: { foreign_shell: { shell: PowerShell, command: "ls $env:USERPROFILE\\.ssh" } }
  expect: { verdict: defer, rules: [unparseable] }

