  expect: { verdict: review, rules: [opaque-code] }
- id: review-awk-environ-token
  threat: T3
  action: { shell: "awk 'BEGIN{print ENVIRON[\"GITHUB_TOKEN\"]}'" }
  expect: { verdict: review, rules: [opaque-code] }
- id: review-awk-getline-from-variable-path
  threat: T1
  action: { shell: "awk -v p=~/.ssh/id_rsa 'BEGIN{while((getline l < p)>0) print l}'" }
  expect: { verdict: review, rules: [opaque-code] }
- id: review-awk-program-from-shell-variable
  threat: T7
  action: { shell: "awk \"$prog\" f" }
  expect: { verdict: review, rules: [opaque-code] }
- id: review-awk-close-and-fflush
  threat: T7
  action: { shell: "awk '{print; close(\"x\"); fflush()}' f" }
  expect: { verdict: review, rules: [opaque-code] }
- id: review-awk-append-redirect-after-regex
  threat: T6
  action: { shell: "awk '/a|b/{print >> \"/Users/me/.zshrc\"}' f" }
  expect: { verdict: review, rules: [opaque-code] }
- id: review-awk-pipe-to-shell-after-regex
  threat: T7
  action: { shell: "awk '/a|b/{print | \"sh\"}' f" }
  expect: { verdict: review, rules: [opaque-code] }
# `perl -pi` whose program is more than substitutions, or substitutes with code, is
