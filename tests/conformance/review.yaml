# Inline code that opens a file, connects, reads the environment or runs a program
# with a name it builds at run time: the scan sees no path, so no deny rule can match
# what it opens (`opaque-code`). Code that only prints, or hands those APIs literal
# text, keeps its verdict (benign.yaml).
- id: review-python-c-opens-built-path
  threat: T1
  action: { shell: "python3 -c 'import os;print(open(os.path.expanduser(\"~/.s\"+\"sh/id_rsa\")).read())'" }
  expect: { verdict: review, rules: [opaque-code] }
- id: review-node-e-reads-built-path
  threat: T1
  action: { shell: "node -e \"console.log(require('fs').readFileSync(process.env.HOME+'/.ss'+'h/id_rsa','utf8'))\"" }
  expect: { verdict: review, rules: [opaque-code] }
- id: review-perl-e-opens-interpolated-path
  threat: T1
  action: { shell: "perl -e 'open F,\"$ENV{HOME}/.s\".\"sh/id_rsa\";print <F>'" }
  expect: { verdict: review, rules: [opaque-code] }
- id: review-python-c-opens-joined-path
  threat: T1
  action: { shell: "python3 -c 'import os;print(open(os.path.join(os.environ[\"HOME\"],\".ssh\",\"id_rsa\")).read())'" }
  expect: { verdict: review, rules: [opaque-code] }
- id: review-ruby-e-reads-concatenated-path
  threat: T1
  action: { shell: "ruby -e 'puts File.read(ENV[\"HOME\"] + \"/.ssh/id_rsa\")'" }
  expect: { verdict: review, rules: [opaque-code] }
- id: review-python-heredoc-opens-built-path
  threat: T7
  action: { shell: "python3 - <<'EOF'\nimport os\nprint(open(os.path.expanduser('~/.s' + 'sh/id_rsa')).read())\nEOF" }
  expect: { verdict: review, rules: [opaque-code] }
- id: review-python-c-execs-decoded-code
  threat: T7
  action: { shell: "python3 -c 'import base64;exec(base64.b64decode(\"cHJpbnQoMSk=\"))'" }
  expect: { verdict: review, rules: [opaque-code] }
- id: review-python-c-writes-a-workflow
  threat: T6
  action: { shell: "python3 -c 'open(\"/p/.github/workflows/x.yml\",\"w\").write(\"on: push\")'" }
  expect: { verdict: review, rules: [runs-later] }

# Browser MCP page opens (ADR-047): look-alike hosts are not the host they imitate.
# A host is matched in its ASCII (punycode) form, so a look-alike never inherits an
# allow; one with characters outside ASCII names no host the hook can read.
- id: review-browser-open-punycode-lookalike
  threat: T12
  action: { mcp_tool: { name: mcp__playwright__browser_navigate, opens: ["https://xn--gthub-2ta.com/login"] } }
  expect: { verdict: defer, rules: [default.fetch] }
- id: review-browser-open-unicode-lookalike
  threat: T12
  action: { mcp_tool: { name: mcp__playwright__browser_navigate, opens: ["https://gíthub.com/login"] } }
  expect: { verdict: defer, rules: [unparseable] }
- id: review-browser-open-unlisted-host
  threat: T12
  action: { mcp_tool: { name: mcp__playwright__browser_navigate, opens: ["https://evil.example/"] } }
  expect: { verdict: defer, rules: [default.fetch] }
# awk programs that write, run or read beyond their file operands stay `awk @<program>`
