  action: { shell: "gh run view 3 --log -o out.txt" }
  expect: { verdict: defer, rules: [default] }
# A patch that names no file cannot be checked
- id: ask-patch-without-files
  threat: T7
  action: { patch: [] }
  expect: { verdict: defer, rules: [unparseable] }
# T12: local services ask rather than being denied as unknown hosts
- id: ask-curl-localhost-dev-server
  threat: T12
