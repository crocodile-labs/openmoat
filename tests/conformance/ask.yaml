  action: { shell: "rm -rf ../other" }
  expect: { verdict: defer, rules: [default] }
- id: ask-recursive-remove-nested-git
  threat: T4
  action: { shell: "rm -rf vendor/lib/.git" }
  expect: { verdict: ask, rules: [git-internals] }
# a directory below the home is not the home: these stay at ask, not destructive
