  threat: T8
  action: { unknown_tool: { host: pi, tool: deploy, writes: ["/p/prod"] } }
  expect: { verdict: defer, rules: [default.tool.unknown] }
# Gemini CLI policy files can allow what OpenMoat leaves to Gemini CLI, and a
# non-interactive run accepts a project's without a question; its custom
# commands run their shell when the person types them, outside any tool hook
- id: ask-write-gemini-project-policy
  threat: T9
  action: { fs_write: "/p/.gemini/policies/allow.toml" }
  expect: { verdict: ask, rules: [runs-later] }
- id: ask-write-gemini-user-policy
  threat: T9
