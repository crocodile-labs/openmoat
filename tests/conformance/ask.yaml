# A line the lexer cannot read in full asks, whatever the catch-all: the atoms of
# the part not read are missing, so a deny there must not become a defer
- id: ask-deny-next-to-an-ansi-c-nul
  threat: T7
  action: { shell: "cat ~/.ssh/id_rsa $'\\x00'" }
  expect: { verdict: ask, rules: [unparseable] }
- id: ask-deny-before-an-unterminated-quote
  threat: T7
  action: { shell: "cat ~/.ssh/id_rsa\necho 'never closed" }
  expect: { verdict: ask, rules: [unparseable] }
# A project whose path holds a glob character names no files: spliced into
