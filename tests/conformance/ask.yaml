  action: { shell: "rm -rf src/.." }
  expect: { verdict: defer, rules: [default] }
- id: ask-recursive-remove-every-entry
  threat: T4
  action: { shell: "rm -rf *" }
  expect: { verdict: defer, rules: [default] }
- id: ask-recursive-remove-every-entry-dotted
