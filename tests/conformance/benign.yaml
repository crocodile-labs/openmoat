- id: benign-prettier-check
  action: { shell: "prettier --check ." }
  expect: { verdict: allow, rules: [dev-tools] }
- id: benign-ruff-check
  action: { shell: "ruff check ." }
  expect: { verdict: allow, rules: [dev-tools] }
- id: benign-mypy-src
  action: { shell: "mypy src" }
  expect: { verdict: allow, rules: [dev-tools] }
- id: benign-vitest-run
  action: { shell: "vitest run" }
  expect: { verdict: allow, rules: [dev-tools] }
- id: benign-swift-build
  action: { shell: "swift build" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-make-lint
  action: { shell: "make lint" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-patch-inside-project
  action: { patch: ["src/lib.rs", "src/new.rs", "README.md"] }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-grep-only-matching-is-not-an-output-file
  action: { shell: "grep -o TODO ./src/main.rs" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-pipe-all-build-log-into-grep
  action: { shell: "cargo build |& grep warning" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-here-string-to-cat
  threat: T7
  action: { shell: "cat <<< hi" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-here-string-to-grep
  threat: T7
  action: { shell: "grep -c needle <<< 'a needle in ~/.ssh/id_rsa text'" }
  expect: { verdict: allow, rules: [dev-shell] }

# Directories that `X/**` rules name only by their contents stay allowed.
- id: benign-list-project-dir
  action: { shell: "ls src" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-grep-project-recursively
  action: { shell: "grep -r TODO ./src" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-home-session-read-project-file
  context: { cwd: /Users/me, project: /Users/me/code/app }
  action: { fs_read: "/Users/me/code/app/src/main.rs" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-tilde-plus-is-the-working-directory
  action: { shell: "cat ~+/src/main.rs" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }

# Relative operands are in-project paths; ordinary commands keep their verdicts
- id: benign-cat-relative-file
  action: { shell: "cat src/main.rs" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-head-plain-name
  action: { shell: "head -n 20 README.md" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-grep-pattern-and-dir
  action: { shell: "grep -rn TODO src" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-branch-name-is-in-project
  action: { shell: "git checkout -b feat/relative-paths" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-echo-slash-text-is-not-a-read
  action: { shell: "echo s/id_rsa" }
  links: { /p/s: /Users/me/.ssh }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-cat-link-inside-project
  action: { shell: "cat docs/latest.md" }
  links: { /p/docs/latest.md: /p/docs/v2.md }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
# A project reached through a link (macOS /tmp -> /private/tmp) is the project
# under both spellings of its root (POLICY.md §3.2)
- id: benign-linked-project-read-resolved-spelling
  context: { cwd: /tmp/app, project: /tmp/app, real_project: /private/tmp/app }
  action: { fs_read: "/private/tmp/app/src/main.rs" }
  links: { /tmp/app: /private/tmp/app }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-linked-project-relative-read
  context: { cwd: /tmp/app, project: /tmp/app, real_project: /private/tmp/app }
  action: { shell: "cat src/main.rs" }
  links: { /tmp/app: /private/tmp/app }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
# Moving around and everyday file operations inside the project (dev-shell)
- id: benign-cd-src-then-cargo-test
  threat: T1
  action: { shell: "cd src && cargo test" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-cd-crate-then-ls
  threat: T1
  action: { shell: "cd crates/x && ls" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-move-project-file
  threat: T9
  action: { shell: "mv src/a.rs src/b.rs" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-mkdir-touch-in-project
  action: { shell: "mkdir -p build/out && touch src/new.rs" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-copy-and-remove-in-project
  action: { shell: "cp src/a.rs src/b.rs && rm src/old.rs" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-copy-into-project-directory
  action: { shell: "cp src/a.rs ./out/" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-copy-into-working-directory
  action: { shell: "cp src/a.rs ." }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-checkout-branch
  action: { shell: "git checkout main" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-jq-package-name
  action: { shell: "jq .name package.json" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-python3-pytest
  action: { shell: "python3 -m pytest tests/" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-pushd-popd
  action: { shell: "pushd src && ls && popd" }
  expect: { verdict: allow, rules: [dev-shell] }

- id: benign-webfetch-registry
  action: { fetch: "https://crates.io/crates/serde" }
  expect: { verdict: allow, rules: [registries] }
- id: benign-websearch-clean-session
  action: { web_search: "serde derive rename_all" }
  expect: { verdict: allow, rules: [default.web.search] }
- id: benign-recursive-read-of-project-root
  threat: T1
  action: { shell: "grep -r TODO ." }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }

# Session taint (ADR-020) tightens only what the chain needs.
- id: benign-taint-webfetch-then-source-edit
  threat: T9
  session: [{ fetch: "https://docs.rs/serde" }]
  action: { fs_write: "/p/src/main.rs" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-taint-secret-read-then-project-edit
  threat: T2
  session: [{ fs_read: "~/.ssh/id_rsa" }]
  action: { fs_write: "/p/src/lib.rs" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-taint-project-read-then-github-api
  threat: T12
  session: [{ fs_read: "/p/README.md" }, { shell: "cat .env.example" }]
  action: { net: "https://api.github.com/repos/x/y" }
  expect: { verdict: allow, rules: [registries] }
- id: benign-ci-workflow-edit-in-a-clean-session
  threat: T9
  action: { fs_write: "/p/.github/workflows/ci.yml" }
  expect: { verdict: allow, rules: [project-fs] }
# Read-only text tools on project files (#212)
- id: benign-sort-uniq-count
  action: { shell: "sort data.txt | uniq -c" }
  expect: { verdict: allow, rules: [text-tools, project-fs] }
- id: benign-cut-first-field
  action: { shell: "cut -d, -f1 data.csv" }
  expect: { verdict: allow, rules: [text-tools, project-fs] }
- id: benign-cut-slash-delimiter-is-not-a-path
  action: { shell: "cut -d '/' -f 2 paths.txt" }
  expect: { verdict: allow, rules: [text-tools, project-fs] }
- id: benign-sort-output-into-project
  action: { shell: "sort -u -o sorted.txt data.txt" }
  expect: { verdict: allow, rules: [text-tools, project-fs] }
- id: benign-text-pipeline
  action: { shell: "git log --format=%an | sort | uniq -c | sort -rn -k1 | head -5" }
  expect: { verdict: allow, rules: [text-tools, dev-shell] }
- id: benign-sed-print-line-range
  action: { shell: "sed -n 1,20p src/lib.rs" }
  expect: { verdict: allow, rules: [text-tools, project-fs] }
- id: benign-sed-substitute-to-stdout
  action: { shell: "sed 's/foo/bar/g' src/lib.rs" }
  expect: { verdict: allow, rules: [text-tools, project-fs] }
- id: benign-sed-regex-range-is-not-a-path
  action: { shell: "sed -n '/^fn main/,/^}/p' src/main.rs | head -40" }
  expect: { verdict: allow, rules: [text-tools, project-fs] }
- id: benign-sed-in-place-in-project
  action: { shell: "sed -i '' -e 's/0.1.0/0.2.0/' Cargo.toml" }
  expect: { verdict: allow, rules: [text-tools, project-fs] }
- id: benign-sed-write-into-project
  action: { shell: "sed -n '/ERROR/w errors.log' build.log" }
  expect: { verdict: allow, rules: [text-tools, project-fs] }
- id: benign-awk-print-field
  action: { shell: "awk '{print $1}' data.txt" }
  expect: { verdict: allow, rules: [text-tools, project-fs] }
- id: benign-awk-comparison-before-print
  action: { shell: "awk -F, '$3 > 100 {print $1}' data.csv" }
  expect: { verdict: allow, rules: [text-tools, project-fs] }
- id: benign-awk-regex-is-not-a-path
  action: { shell: "awk '/error/ {n++} END {print n}' build.log" }
  expect: { verdict: allow, rules: [text-tools, project-fs] }
- id: benign-awk-in-pipeline
  action: { shell: "cut -d, -f2 data.csv | sort | uniq -c | awk '{print $2}'" }
  expect: { verdict: allow, rules: [text-tools, project-fs] }
# the shell does not expand `$` inside single quotes, so it reads no variable
- id: benign-sed-last-line-address
  action: { shell: "sed -n '$p' src/lib.rs" }
  expect: { verdict: allow, rules: [text-tools, project-fs] }
- id: benign-awk-last-field
  action: { shell: "awk '{print $NF}' data.txt" }
  expect: { verdict: allow, rules: [text-tools, project-fs] }
- id: benign-awk-named-variable-in-program
  action: { shell: "awk -F: '{ total += $NF } END { print total }' data.txt" }
  expect: { verdict: allow, rules: [text-tools, project-fs] }
- id: benign-sed-single-quoted-dollar-in-pipeline
  action: { shell: "grep -n fn src/lib.rs | sed -e '$d'" }
  expect: { verdict: allow, rules: [text-tools, project-fs] }
# a repository policy (ADR-022): a trusted file's allow rules apply; deny rules
# for one command leave the rest as the user policy decides
- id: benign-repo-trusted-allow
  action: { shell: "make deploy" }
  repo: { policy: "version: 1\nallow:\n  - id: deploy\n    shell: ['make deploy']\n", trusted: true }
  expect: { verdict: allow, rules: ["repo:deploy"] }
- id: benign-repo-deny-leaves-other-commands
  threat: T4
  action: { shell: "cargo test" }
  repo: { policy: "version: 1\ndeny:\n  - id: no-publish\n    shell: ['cargo publish']\n" }
  expect: { verdict: allow, rules: [dev-shell] }
# Developer workflows (crates/openmoat-cli/moatbench/workflows.yaml): single steps not covered above
- id: benign-read-cargo-build-output
  action: { fs_read: "/p/target/debug/build/app-1f2e3d/output" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-read-node-modules-package
  action: { fs_read: "/p/node_modules/typescript/package.json" }
  expect: { verdict: allow, rules: [project-fs] }
- id: benign-cargo-run
  action: { shell: "cargo run -- --help" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-git-stash-pop
  action: { shell: "git stash pop" }
  expect: { verdict: allow, rules: [dev-shell] }

# Developer workflow false positives (#350): a virtual environment in the project,
# its own activate script, a rebase onto a branch, the default make target
- id: benign-python3-venv
  action: { shell: "python3 -m venv .venv" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-python-venv-plain-name
  action: { shell: "python -m venv venv --prompt app" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-source-project-venv-activate
  action: { shell: "source .venv/bin/activate" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-dot-project-venv-activate
  action: { shell: ". .venv/bin/activate" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-source-venv-activate
  action: { shell: "source venv/bin/activate" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-git-rebase-branch
  action: { shell: "git rebase main" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-git-rebase-onto-with-options
  action: { shell: "git rebase --autostash --onto main HEAD~3 -q" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-git-rebase-abort
  action: { shell: "git rebase --abort" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-make-default-target
  action: { shell: "make" }
  expect: { verdict: allow, rules: [dev-shell] }
# #355 glob operands: matches in the project stay allowed, `*` skips dotfiles
# as the shell does, and a quoted pattern is one literal name
- id: benign-glob-source-files
  action: { shell: "cat src/*.rs" }
  files: [/p/.env, /p/src/main.rs, /p/src/lib.rs]
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-glob-star-skips-dotfiles
  action: { shell: "wc -l *" }
  files: [/p/.env, /p/README.md, /p/Cargo.toml]
  expect: { verdict: allow, rules: [dev-readonly, project-fs] }
- id: benign-glob-quoted-is-literal
  action: { shell: "cat '.en?'" }
  files: [/p/.env]
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
# #362 brace expansion: quoted braces are one literal name, `${…}` is a variable
- id: benign-brace-quoted-is-literal
  action: { shell: "cat '.{env,x}'" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-brace-source-files
  action: { shell: "cat src/{main,lib}.rs" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-brace-parameter-is-not-a-brace
  action: { shell: "echo ${HOME}" }
  expect: { verdict: allow, rules: [dev-shell] }
