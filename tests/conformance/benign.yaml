- id: benign-rg-struct
  action: { shell: "rg -n struct src" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-find-ts-files
  action: { shell: "find src -name '*.ts'" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-ls-long
  action: { shell: "ls -la src" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-head-cargo-toml
  action: { shell: "head -n 20 Cargo.toml" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-tail-test-log
  action: { shell: "tail -n 50 ./target/test.log" }
  expect: { verdict: allow, rules: [dev-shell, project-fs] }
- id: benign-wc-lines
  action: { shell: "wc -l src/main.rs" }
