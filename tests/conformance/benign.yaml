  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-tsc-project
  action: { shell: "tsc -p tsconfig.json" }
  expect: { verdict: allow, rules: [dev-tools] }
- id: benign-eslint-src
  action: { shell: "eslint src --ext .ts" }
