  expect: { verdict: defer, rules: [default] }
- id: benign-export-git-editor-true
  action: { shell: "export GIT_EDITOR=true; git commit --amend" }
  expect: { verdict: defer, rules: [default] }
- id: benign-path-kept
  action: { shell: "PATH=$PATH cargo build" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-path-kept-quoted
  action: { shell: "PATH=\"$PATH\" cargo test" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-path-system-directories
  action: { shell: "PATH=/usr/bin:/bin:/usr/sbin:/sbin cargo build" }
  expect: { verdict: allow, rules: [dev-shell] }
- id: benign-env-clean-system-path
  action: { shell: "env -i PATH=/usr/bin:/bin cargo build" }
