# an editor variable set to a no-op or a reader, and `PATH` kept as it is or set to
# system directories only, change nothing about what later commands run
# (shell/tokens.rs), so `env-poison` does not see them; the command itself is decided
# as without them (`git rebase --continue` and `env … cmd` defer to the agent's prompt)
- id: benign-git-editor-true-rebase-continue
  action: { shell: "GIT_EDITOR=true git rebase --continue" }
  expect: { verdict: defer, rules: [default] }
- id: benign-editor-true-commit-amend
