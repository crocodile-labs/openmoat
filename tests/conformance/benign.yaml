- id: benign-docker-images
  action: { shell: "docker images" }
  expect: { verdict: allow, rules: [dev-readonly] }
- id: benign-docker-logs
  action: { shell: "docker logs web" }
  expect: { verdict: allow, rules: [dev-readonly] }
- id: benign-gh-pr-view
  action: { shell: "gh pr view 12" }
  expect: { verdict: allow, rules: [dev-readonly] }
- id: benign-gh-pr-list
  action: { shell: "gh pr list --state open" }
  expect: { verdict: allow, rules: [dev-readonly] }
- id: benign-gh-issue-list
  action: { shell: "gh issue list" }
