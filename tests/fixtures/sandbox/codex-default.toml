[shell_environment_policy.set]
GIT_CONFIG_COUNT = "1"
GIT_CONFIG_KEY_0 = "safe.bareRepository"
GIT_CONFIG_VALUE_0 = "explicit"
# stricter: fs.read `agent-temp`: `/tmp/claude-*/**` cannot be granted as a path, so it stays denied
# stricter: fs.read `agent-temp`: `/private/tmp/claude-*/**` cannot be granted as a path, so it stays denied
# stricter: fs.read `secrets-paths`: Codex cannot re-allow inside a deny glob, so the exceptions (**/.env.example, **/.env.sample, **/.env.template, **/.env.dist, **/.env.*.example, **/.env.*.sample, **/.env.*.template) stay denied
# stricter: fs.read `destructive`: a profile glob can only deny, so sandboxed commands cannot read these either: /dev/disk*, /dev/rdisk*, /dev/sd*, /dev/nvme*, /dev/mmcblk*, /dev/vd*, /dev/xvd*
# stricter: fs.read `kernel-self`: a profile glob can only deny, so sandboxed commands cannot read these either: /Users/me/.config/systemd/user/*moat-*/**, /run/user/*/systemd/*/*moat-*/**, /Users/me/Library/LaunchAgents/dev.openmoat.*, **/.claude/settings.json, **/.claude/settings.local.json, **/.cursor/hooks.json, **/.cursor/sandbox.json, **/.codex/hooks.json, **/.copilot/hooks/**, **/.copilot/settings.json, **/.copilot/config.json, **/.github/copilot/settings.json, **/.github/copilot/settings.local.json, **/.gemini/settings.json, /Users/me/.config/opencode/service*.json, **/.config/goose/settings.json, **/.config/goose/settings.local.json, **/.agents/plugins/**, **/.agents/hooks.json, **/.agents/mcp_config.json, **/.moat/**, **/bin/moat, **/bin/moat.exe, **/bin/openmoat, **/bin/openmoat.exe, **/apps/moat/current, **/apps/moat/*/moat.exe, **/apps/openmoat/current, **/apps/openmoat/*/moat.exe, **/apps/openmoat/*/openmoat.exe
# stricter: fs.write `codex.git`: Codex keeps all of `.git` read-only: sandboxed commands cannot commit, Codex asks to run them outside the sandbox
# wider: fs.read `codex.minimal`: Codex's minimal platform reads (system libraries, devices) every command needs
# wider: fs.read `sandbox.read_roots`: the hook decides these reads by the rules (review by default); OS layers allow them so commands can run, and deny rules still win
# wider: fs.write `codex.nested-git`: a profile glob can only deny, which would also block reading every `.git`, so sandboxed commands may write a `.git` file (`gitdir: …`) or directory below a workspace root; Codex keeps the root's own `.git` read-only, and the hook holds those writes for review
# wider: fs.write `codex.runs-later`: a profile glob can only deny, which would also block reading them, so sandboxed commands may write CI configuration, commit-hook managers' files and editor tasks; the hook holds them for review (`runs-later`)
# wider: fs.write `codex.tmpdir`: commands may write the temp directory; the hook holds them for review
# wider: fs.write `codex.directory-nodes`: a denied directory covers its subtree, so these directory nodes are left out and only the files below them are denied; renaming or deleting the directory itself is left to the hook
# wider: fs.read `codex.outside-home`: Codex on Linux lists every directory below a deny glob before each command and runs no command when one is unreadable (root-only directories under /etc and /tmp), so `**/` denies (`.env` files) cover the project and the read roots in the home but not these directories; the hook still denies the agent's own reads there
