[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # unsafe-libyaml is unmaintained (no known vulnerability, no safe upgrade); it comes
    # with serde_yaml_ng, the policy parser. Moving to a maintained parser: #488.
    { id = "RUSTSEC-2024-0449", reason = "unmaintained, no known vulnerability; replacing the YAML parser in #488" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# openmoat-core must stay free of I/O and runtime crates (docs/ARCHITECTURE.md §1).
deny = [
    { crate = "tokio", wrappers = ["openmoat"] },
    { crate = "rusqlite", wrappers = ["openmoat-audit"] },
    { crate = "reqwest", wrappers = ["openmoat"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
