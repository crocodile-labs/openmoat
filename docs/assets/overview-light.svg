<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-label="OpenMoat sits between your AI coding agents and your machine. Twelve agents (Claude Code, Codex, Cursor and nine more) send every tool call through OpenMoat. Its parts: a policy engine that decides each call before it runs, OS sandboxes for the code an allowed call runs, an egress proxy that lets network reach only allowed hosts, a secret broker that keeps your tokens out of the agent, an MCP gateway that pins servers and tools, an audit trail of every decision, a merge check for pull requests and a policy lock the agent cannot change. It guards your files and secrets, shell and programs, network, MCP servers, and git, CI and editors. One policy, on your machine, no AI model.">
