<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 616" width="960" height="616" role="img" aria-label="How OpenMoat works. An AI coding agent wants to run a tool call. Through the agent's own hook, before the call runs, OpenMoat reads what the call really does, checks it against one local policy and answers: allow (npm test runs), defer (an unknown install goes to the agent's own prompt), review (a git hook change waits for you) or deny (reading ~/.ssh/id_rsa never runs). Allowed code is still confined by the OS sandbox and the egress proxy, the policy is locked against the agent, and every decision goes into a local hash-chained audit log.">
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#30363d"/></pattern>
</defs>
<rect width="960" height="616" fill="#0d1117"/>
<rect width="960" height="616" fill="url(#dots)" opacity="0.6"/>
<rect x="24" y="128" width="178" height="176" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="113" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e6edf3" text-anchor="middle">AI coding agent</text>
<text x="113" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">Claude Code, Codex, Cursor</text>
<text x="113" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="middle">and eight more</text>
<text x="42" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#68a1cb" text-anchor="start">Bash</text>
<text x="90" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="start">npm test</text>
<text x="42" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#68a1cb" text-anchor="start">Read</text>
<text x="90" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="start">~/.ssh/id_rsa</text>
<text x="42" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#68a1cb" text-anchor="start">Fetch</text>
<text x="90" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="start">a web page</text>
<line x1="204" y1="216" x2="282" y2="216" stroke="#8b949e" stroke-width="1.6" marker-end="url(#head)"/>
<text x="243" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">tool call</text>
<text x="243" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">before it runs</text>
<rect x="286" y="90" width="388" height="254" rx="20" fill="#68a1cb" fill-opacity="0.14"/>
<rect x="296" y="100" width="368" height="234" rx="16" fill="#1c2330" stroke="#68a1cb" stroke-width="2"/>
<text x="480" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="middle">OpenMoat</text>
<text x="480" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="middle">through the agent's own hook · on your machine · no AI model</text>
<circle cx="326" cy="186" r="12" fill="#68a1cb"/>
<text x="326" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">1</text>
<text x="348" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Read what the call really does</text>
<text x="348" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">variables, quoting, base64, $(…), bash -c, symlinks</text>
<circle cx="326" cy="236" r="12" fill="#68a1cb"/>
<text x="326" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">2</text>
<text x="348" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Check it against one local policy</text>
<text x="348" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">the files, hosts and programs it touches, and the session</text>
<circle cx="326" cy="286" r="12" fill="#68a1cb"/>
<text x="326" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">3</text>
<text x="348" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="start">Answer the agent's hook</text>
<text x="348" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">the strictest verdict wins; an error is a deny</text>
<line x1="664" y1="216" x2="736" y2="128" stroke="#8b949e" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="740" y="104" width="196" height="48" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="740" y="104" width="5" height="48" rx="2" fill="#3fb950"/>
<text x="756" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#3fb950" text-anchor="start">ALLOW</text>
<text x="926" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="end">runs</text>
<text x="756" y="141" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="start">npm test</text>
<line x1="664" y1="216" x2="736" y2="186" stroke="#8b949e" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="740" y="162" width="196" height="48" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="740" y="162" width="5" height="48" rx="2" fill="#8b949e"/>
<text x="756" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#8b949e" text-anchor="start">DEFER</text>
<text x="926" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="end">your agent asks</text>
<text x="756" y="199" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="start">npm install left-pad</text>
<line x1="664" y1="216" x2="736" y2="244" stroke="#8b949e" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="740" y="220" width="196" height="48" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="740" y="220" width="5" height="48" rx="2" fill="#d29922"/>
<text x="756" y="239" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#d29922" text-anchor="start">REVIEW</text>
<text x="926" y="239" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="end">waits for you</text>
<text x="756" y="257" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="start">git config core.hooksPath .h</text>
<line x1="664" y1="216" x2="736" y2="302" stroke="#8b949e" stroke-width="1.6" marker-end="url(#head)"/>
<rect x="740" y="278" width="196" height="48" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="740" y="278" width="5" height="48" rx="2" fill="#f85149"/>
<text x="756" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#f85149" text-anchor="start">DENY</text>
<text x="926" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="end">never runs</text>
<text x="756" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="start">cat ~/.ssh/id_rsa</text>
<text x="32" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Allowed code is still guarded</text>
<text x="32" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8b949e" text-anchor="start">An allowed npm test can run anything; these layers bound what it can do.</text>
<rect x="32" y="442" width="212" height="104" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="32" y="442" width="212" height="4" rx="2" fill="#68a1cb"/>
<text x="50" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">OS sandbox</text>
<text x="50" y="498" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">the agent's own, written from the</text>
<text x="50" y="516" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">same policy, or openmoat run</text>
<rect x="260" y="442" width="212" height="104" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="260" y="442" width="212" height="4" rx="2" fill="#68a1cb"/>
<text x="278" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Egress proxy</text>
<text x="278" y="498" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">network only to the hosts the</text>
<text x="278" y="516" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">policy lists</text>
<rect x="488" y="442" width="212" height="104" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="488" y="442" width="212" height="4" rx="2" fill="#68a1cb"/>
<text x="506" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Policy lock</text>
<text x="506" y="498" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">the agent cannot edit the rules or</text>
<text x="506" y="516" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">approve its own blocked call</text>
<rect x="716" y="442" width="212" height="104" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect x="716" y="442" width="212" height="4" rx="2" fill="#68a1cb"/>
<text x="734" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="start">Audit log</text>
<text x="734" y="498" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">every decision, local and</text>
<text x="734" y="516" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8b949e" text-anchor="start">hash-chained; watch, why, report</text>
<line x1="640" y1="336" x2="800" y2="438" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#head)"/>
<text x="732" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">every decision is recorded</text>
<text x="480.0" y="588" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="middle">One policy for every agent · nothing leaves your machine</text>
</svg>
