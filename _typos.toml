# Spell check (https://github.com/crate-ci/typos), run by CI and the quality gate.
# The project writes British English; the words below are American spellings or
# fragments that belong to someone else's name and must stay as they are.

[files]
extend-exclude = [
    "LICENSE",                 # licence texts are quoted verbatim
    "LICENSE-*",
    "crates/openmoat-core/data/top-packages/*.txt",  # package names as their authors spell them
]

[default]
locale = "en-gb"
extend-ignore-re = [
    "\\[o\\]nce",  # the `Allow? [o]nce` prompt
    "--artifacts?-(path|dir)",  # option names of dotnet and cargo, spelt as the tools spell them
    "\\$!ba;",     # a sed branch to label `a`
    "\"-nd\"",     # wget's `-nd` (no directories)
    "`-oout`",     # curl's `-o` with its value attached
    "bash-authorize",  # the npm package compared in docs/MOATBENCH.md, spelt as its author spells it
    "\\./ba\\b",   # its install directory in the MoatBench comparison
    "--inh-caps",  # setpriv's option for the inheritable capabilities
    "vision_analyze",  # Hermes Agent's tool, spelt as Hermes spells it
    "config/normalize\\.ts",  # OpenCode 2's source file, cited by its name
    "\\bcatalog(\\.ts|\":)",  # OpenCode 2's `mcp/catalog.ts` and `mcp.timeout.catalog` key, spelt as OpenCode spells them
]

[default.extend-identifiers]
TransactionBehavior = "TransactionBehavior" # rusqlite
AppArmor = "AppArmor"

[default.extend-words]
# OpenMoat's own rule id and verdict reason.
unparseable = "unparseable"
# The RustCrypto `sha2`/`digest` API (`Digest::finalize`), used for HMAC-SHA-256.
finalize = "finalize"
# serde (`Serialize`, `skip_serializing_if`).
serialize = "serialize"
serializing = "serializing"
# The HTTP `Authorization` header and OAuth wording around it.
authorization = "authorization"
authorized = "authorized"
# Apple's `containerization` toolchain (ADR-023).
containerization = "containerization"
# `--color`, git's `color.*` keys.
color = "color"
# The MCP `initialize` request.
initialize = "initialize"
# Gemini CLI's `tracker_visualize` tool.
visualize = "visualize"# git takes a prefix of a long option: `--strat` is `--strategy` (conformance fixtures).
strat = "strat"
# LLVM sanitizers, which cargo fuzz builds with.
sanitizers = "sanitizers"
# macOS `com.apple.system.notification_center`.
center = "center"
# A deliberate typosquat in a MoatBench scenario (`pip install reqeusts`).
reqeusts = "reqeusts"
# Deliberate typos of package names in the near-miss tests and docs (ADR-030).
requets = "requets"
reqests = "reqests"
expresss = "expresss"
expres = "expres"
jist = "jist"
# npm's own aliases of `install` (`npm isntall`), which the classifier reads.
instal = "instal"
isnt = "isnt"
isnta = "isnta"
isntal = "isntal"
isntall = "isntall"
# The name of a third-party MCP server in the MCP tool-name tests (`vigil-harbor`).
harbor = "harbor"
# Claude Code's `Artifact` and `ArtifactData` tools.
artifact = "artifact"
