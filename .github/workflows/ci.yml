name: ci

# What runs, and why (CONTRIBUTING "CI"):
# - A pull request: `lint` and `crates` on Linux, the tests in two parts on
#   each of Linux, macOS and Windows (`test`), the stock-Linux path, the fuzz
#   smoke, the JavaScript jobs and the lexer against bash. All of them are
#   behind `ci-ok`, the one required check. `guard latency` runs too, on
#   Linux, and is reported, never blocking (scripts/ci/ci_ok.py).
# - A push to main: all of that, plus guard latency on macOS (blocking there),
#   ten minutes of fuzzing per target, and ADR-062 step 0 (adr062-poc.yml).
#   When it ends red, or a test needed its retry, ci-retry.yml opens an issue.
# - A failure that is only infrastructure (a runner not acquired, a name that
#   did not resolve, a GitHub 5xx) is re-run once by ci-retry.yml.
# - Weekly (weekly.yml): macOS Intel in three parts, the quarantined tests,
#   the toolchain canary, coverage, the long session.
#
# Every Rust test runs under cargo-nextest (.config/nextest.toml): a time
# limit per test, one retry reported as flaky (never for a sandbox, deny or
# bypass test), a JUnit report that becomes each job's summary.
# Each job's time limit is at least twice its usual time; scripts/ci/budget.sh
# warns past 60%. Limits are not raised: a slow job is split or sped up.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly on main: cargo-deny sees new advisories, fuzz runs 600 s per target
  # By hand (Actions → ci → Run workflow): every job, with long fuzz.
  workflow_dispatch:

# A new push to a pull request cancels the run of the push before. Runs on
# main and on schedule each have a group of their own (the run id), so none is
# cancelled, nor dropped while waiting behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # A crates.io or git fetch that fails is tried again, not the job.
  CARGO_NET_RETRY: "10"

jobs:
  # What the other jobs run (scripts/ci/changes.py says what counts). On a
  # pull request `code` is false when it changes documentation only, and
  # `long_fuzz` (ten minutes a fuzz target) is true only with the `ci:full`
  # label. On a push to main, on schedule and by hand both are true: main runs
  # everything, and a release needs main's run green (release.yml).
  #
  # A job skipped by its `if` reports success under its name, which meets a
  # required check. A matrix job skipped that way reports one check under its
  # unexpanded name and none under each leg's; so the matrix jobs always run,
  # and a leg with nothing to do runs on ubuntu-latest with every step
  # skipped. When this job fails, its outputs are empty and the jobs test
  # `!= 'false'`: not knowing what changed runs everything, it never skips a
  # test.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the `ci:full` label, read now so a re-run sees it
    outputs:
      code: ${{ steps.what.outputs.code }}
      long_fuzz: ${{ steps.what.outputs.long_fuzz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # a pull request's merge commit and the base it lands on
      - name: what changed
        id: what
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # On a pull request the base branch's copy of changes.py decides (the
        # merge commit's first parent, the commit the PR lands on), not the
        # PR's own, so a PR cannot choose what its own run skips. Only while
        # the base has no copy that takes `--event` does the PR's copy run,
        # with a warning. A push, the schedule and a run by hand use the
        # commit itself.
        run: |
          script=scripts/ci/changes.py
          if [ "$EVENT" = pull_request ]; then
            if git show HEAD^1:scripts/ci/changes.py > "$RUNNER_TEMP/changes.py" \
                && grep -qF -- '"--event"' "$RUNNER_TEMP/changes.py"; then
              script="$RUNNER_TEMP/changes.py"
            else
              echo "::warning::the base branch has no changes.py that takes --event; the pull request's own copy decides"
            fi
          fi
          python3 -I "$script" --event "$EVENT" --pr "$PR" HEAD^1 HEAD >> "$GITHUB_OUTPUT"

  # Everything that runs once, on Linux. The checks that read documentation
  # (shell scripts, links, spelling, changelog fragments, release version
  # strings, CI's own script tests, the workflows) run on every pull request;
  # the Rust ones (fmt, rustdoc, policy lint, wasm32 purity, unused
  # dependencies, cargo-deny) when code changed.
  lint:
    name: lint
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODE: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - name: start the time budget
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck, typos and actionlint (pinned, checksums verified)
        env:
          SHELLCHECK: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          TYPOS: 1.51.1
          TYPOS_SHA256: 93c301fd4120ff076e2cc2a6d6a61cab4a4bdb81899287c0938b452e56d1f454
          ACTIONLINT: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          fetch() { curl -fsSL --retry 5 --retry-all-errors -o "$1" "$2"; }
          fetch shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK}/shellcheck-v${SHELLCHECK}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar xJf shellcheck.tar.xz
          mv "shellcheck-v${SHELLCHECK}/shellcheck" "$bin/"
          fetch typos.tgz "https://github.com/crate-ci/typos/releases/download/v${TYPOS}/typos-v${TYPOS}-x86_64-unknown-linux-musl.tar.gz"
          echo "${TYPOS_SHA256}  typos.tgz" | sha256sum -c -
          tar xzf typos.tgz ./typos
          mv typos "$bin/"
          fetch actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT}/actionlint_${ACTIONLINT}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          mv actionlint "$bin/"
          echo "$bin" >> "$GITHUB_PATH"
      - name: shell scripts, links, spelling, changelog, versions, CI script tests
        env:
          GATE_STEPS: checks
        run: scripts/ci/quality-gate.sh
      - name: workflows (actionlint, zizmor)
        # zizmor: a static audit of these workflows: injection, credential
        # persistence, over-privileged tokens, unpinned actions.
        run: |
          actionlint -color
          pipx run --spec zizmor==1.30.1 zizmor --offline .github/workflows
      - name: rust toolchain
        if: env.CODE == 'true'
        # The channel, components and targets come from rust-toolchain.toml.
        run: rustup toolchain install --no-self-update
      # Every rust-cache saves from main only (a pull request restores, never
      # writes: no cache poisoning from a PR, fewer evictions), under a key of
      # its own job; the runner's OS and arch are in the key already. It keeps
      # the tools `cargo install` built, so they are built once on main.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: env.CODE == 'true'
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo-machete and cargo-deny
        if: env.CODE == 'true'
        # cargo-machete rather than cargo-shear: shear 1.14 needs rustc 1.98,
        # newer than the pinned toolchain. Installed from crates.io rather than
        # through cargo-deny-action, whose Docker Hub pull hits the rate limit.
        run: |
          cargo install cargo-machete --version 0.9.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: fmt, rustdoc, policy lint, wasm32 purity, unused dependencies
        if: env.CODE == 'true'
        env:
          GATE_STEPS: fmt doc rust-checks
        run: scripts/ci/quality-gate.sh
      - name: cargo-deny
        if: env.CODE == 'true'
        run: cargo deny --locked check
      - name: time budget
        if: always()
        env:
          LIMIT: 30
        run: bash scripts/ci/budget.sh "$LIMIT"

  # The published crates: each built from its packaged tarball as crates.io
  # will (a file read from outside a crate passes the tests but fails here),
  # and the library crates' API against their last state (CONTRIBUTING "API
  # changes"; while the version is 0.x, a break needs a minor bump).
  crates:
    name: crates (package, semver)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # the `breaking` label
    steps:
      - name: start the time budget
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the base commit is the baseline
      - name: rust toolchain
        # The channel, components and targets come from rust-toolchain.toml.
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: crates
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo package --locked --workspace
      - run: cargo install cargo-semver-checks --version 0.51.0 --locked
      - name: this pull request against its base
        # Blocking, unless the PR is labelled `breaking`: an intended break
        # says so in its Release note, and the next release bumps the minor.
        # The label is read now, not from the event, so re-running the job
        # after labelling is enough.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if cargo semver-checks check-release -p openmoat-core -p openmoat-hosts -p openmoat-audit -p openmoat-proxy -p openmoat-sdk --baseline-rev "$BASE_SHA"; then
            exit 0
          fi
          if gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx breaking; then
            echo "::warning::breaking API change, accepted by the 'breaking' label; the next release bumps the minor version"
            exit 0
          fi
          echo "::error::breaking API change; see CONTRIBUTING 'API changes' (label the PR 'breaking' if it is intended)"
          exit 1
      - name: the workspace against the latest crates.io release
        # Reports what the next release must bump. Blocking only on a release
        # PR (`build: release …`), whose version bump must cover every break.
        continue-on-error: "${{ !startsWith(github.event.pull_request.title, 'build: release') }}"
        run: cargo semver-checks check-release -p openmoat-core -p openmoat-hosts -p openmoat-audit -p openmoat-proxy
      - name: time budget
        if: always()
        env:
          LIMIT: 30
        run: bash scripts/ci/budget.sh "$LIMIT"

  # The tests, in two parts on each OS (nextest `--partition slice:k/2`):
  # clippy (all targets, and the strict lints on library and binary code) in
  # part 2 of each OS, which lints what only that OS compiles; doc tests and,
  # on macOS and Linux, the standard tier (every differential scenario under
  # Claude Code's sandbox and Codex's, pinned binaries, no account, no API
  # call) in part 1. Two macOS jobs per pull request.
  test:
    name: ${{ matrix.label }} (${{ matrix.part }}/2)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.code != 'false' && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RUN_LEG: ${{ needs.changes.outputs.code != 'false' }}
      NEXTEST_PROFILE: ci
      GATE_PARTITION: ${{ matrix.part }}/2
      GATE_STEPS: ${{ matrix.part == 2 && 'clippy test' || 'test' }}
      # Part 1 on macOS and Linux: the standard tier.
      STANDARD_TIER: ${{ matrix.part == 1 && matrix.os != 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        part: [1, 2]
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-15
            label: macos
          - os: windows-latest
            label: windows
    steps:
      - name: start the time budget
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: nothing to run
        if: env.RUN_LEG != 'true'
        run: echo "::notice::documentation only; the tests are skipped (see the changes job)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_LEG == 'true'
        with:
          persist-credentials: false
      - name: rust toolchain
        if: env.RUN_LEG == 'true'
        # The channel, components and targets come from rust-toolchain.toml.
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: env.RUN_LEG == 'true'
        with:
          shared-key: test-${{ matrix.part }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo-nextest (pinned, checksum verified)
        if: env.RUN_LEG == 'true'
        run: scripts/ci/install-nextest.sh "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"
      - name: bubblewrap for the isolated tier, socat for the standard tier
        if: env.RUN_LEG == 'true' && runner.os == 'Linux'
        # `moat run --isolate` (#174) and Claude Code's sandbox use bubblewrap;
        # Claude Code's proxy relay is socat. Ubuntu 24.04's AppArmor blocks
        # the unprivileged user namespaces bwrap needs.
        run: |
          bash scripts/ci/apt-install.sh bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: quality gate (${{ env.GATE_STEPS }}, part ${{ matrix.part }} of 2)
        if: env.RUN_LEG == 'true'
        run: scripts/ci/quality-gate.sh
      - name: keep the test report
        if: always() && env.RUN_LEG == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.label }}-${{ matrix.part }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: pinned claude and codex
        if: env.RUN_LEG == 'true' && env.STANDARD_TIER == 'true'
        run: scripts/ci/host-binaries.sh "$RUNNER_TEMP/hosts" >> "$GITHUB_ENV"
      - name: the standard tier (host sandboxes under every layer)
        if: env.RUN_LEG == 'true' && env.STANDARD_TIER == 'true'
        env:
          # A test whose host binary is missing fails here instead of skipping.
          MOAT_REQUIRE_HOST_BINARIES: "1"
        run: scripts/ci/differential.sh differential sandbox_exec
      - name: the checkout is as it was
        # A test that writes outside its temporary directory leaves a file in
        # the checkout. Reported, not yet failing, while any is found.
        if: always() && env.RUN_LEG == 'true'
        run: |
          dirty=$(git status --porcelain --untracked-files=all)
          if [ -n "$dirty" ]; then
            echo "::warning title=dirty checkout::the tests changed the checkout: $(echo "$dirty" | head -5 | tr '\n' ' ')"
          fi
      - name: time budget
        if: always() && env.RUN_LEG == 'true'
        env:
          LIMIT: 30
        run: bash scripts/ci/budget.sh "$LIMIT"

  # `openmoat run` as a stock Ubuntu runs it: no bubblewrap, and AppArmor's
  # restriction on unprivileged user namespaces left on (the image's
  # default), so Landlock and seccomp alone, without a network namespace or
  # masks inside the grants. Every other Linux job installs bubblewrap and
  # lifts the restriction, so without this job the out-of-the-box path never
  # ran end to end. With MOAT_TEST_STOCK_LINUX set the run tests require that
  # path (tests/e2e/run/stock_linux.rs): the port-only notice and `doctor`'s
  # warning, `--netns=require` exiting 64, `--isolate` and a `--write` outside
  # the project refused; and the hostile scripts must meet the Landlock column
  # of docs/EVIDENCE.md, gap rows included.
  stock-linux:
    name: stock linux (Landlock + seccomp, no bubblewrap)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MOAT_TEST_STOCK_LINUX: "1"
    steps:
      - name: start the time budget
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        # The channel, components and targets come from rust-toolchain.toml.
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: stock-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: no bubblewrap, unprivileged user namespaces restricted
        run: |
          if command -v bwrap > /dev/null; then
            sudo apt-get remove -y -q bubblewrap
          fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          if command -v bwrap; then
            echo "::error::bubblewrap is still installed"
            exit 1
          fi
      - name: the run tests and hostile scripts on the stock path
        run: |
          cargo test --locked -p openmoat --test e2e -- --nocapture \
            run:: hostile_scripts_meet_the_os_layer
      - name: time budget
        if: always()
        env:
          LIMIT: 30
        run: bash scripts/ci/budget.sh "$LIMIT"

  # The JavaScript plugins OpenMoat installs into OpenClaw, pi and OpenCode are
  # type-checked strictly (`// @ts-check`, no emit); their Node harnesses run in
  # the test jobs on every OS.
  js-plugins:
    name: JavaScript plugins type-check
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: start the time budget
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --version
      - run: scripts/ci/check-js.sh
      - name: time budget
        if: always()
        env:
          LIMIT: 10
        run: bash scripts/ci/budget.sh "$LIMIT"

  # The JavaScript SDK: the WebAssembly module built for wasm32 and every
  # conformance fixture decided through it under Node (ADR-046).
  sdk-js:
    name: JavaScript SDK (wasm module, conformance under Node)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: start the time budget
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        # The channel, components and targets come from rust-toolchain.toml.
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: sdk-js
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: node --version
      - run: scripts/ci/sdk-js.sh
      - name: time budget
        if: always()
        env:
          LIMIT: 20
        run: bash scripts/ci/budget.sh "$LIMIT"

  # `openmoat guard` per process (scripts/ci/guard-latency.py) and late in a
  # 5,000-call session (scripts/ci/guard-session-latency.py). The binary of
  # the commit before (`HEAD^1`: the commit a pull request lands on, or main's
  # previous commit) is built too and timed in turn with it on this runner,
  # and the change fails only when the guard's own p95 is clearly worse than
  # that (scripts/ci/latency_ab.py): a shared runner is too noisy for a fixed
  # limit (ADR-080). A row over the p95 budget (20 ms Linux, 45 ms macOS)
  # warns. Timing on a shared runner is noise as often as signal, so on a pull
  # request it is reported, never blocking: the Linux leg runs and ci-ok
  # turns its failure into a warning (scripts/ci/ci_ok.py); the macOS leg
  # waits for main, where both block and a red run opens an issue.
  latency:
    name: guard latency (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() }}
    # A matrix job: skipped legs run their (skipped) steps on ubuntu-latest, as in `test`.
    runs-on: ${{ needs.changes.outputs.code != 'false' && (matrix.os != 'macos-15' || github.event_name != 'pull_request') && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 35
    env:
      RUN_LEG: ${{ needs.changes.outputs.code != 'false' && (matrix.os != 'macos-15' || github.event_name != 'pull_request') }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    steps:
      - name: start the time budget
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: nothing to run
        if: env.RUN_LEG != 'true'
        run: echo "::notice::documentation only, or the macOS leg of a pull request (it runs on main); the latency check is skipped"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_LEG == 'true'
        with:
          persist-credentials: false
          fetch-depth: 2 # HEAD^1, the commit the change lands on
      - name: rust toolchain
        if: env.RUN_LEG == 'true'
        # The channel, components and targets come from rust-toolchain.toml.
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: env.RUN_LEG == 'true'
        with:
          shared-key: latency
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build this commit and the one before
        id: build
        if: env.RUN_LEG == 'true'
        # The base is built from a worktree into the same target directory, so
        # the dependencies are compiled once and only the workspace crates
        # twice. A base that does not build (a toolchain change, say) leaves the
        # one-binary limit in force, with a warning. Every event times the
        # commit before beside this one: a fixed limit on main failed macOS
        # runs whose guard code had not changed (ADR-080).
        run: |
          cargo build --locked --release -p openmoat
          mkdir -p "$RUNNER_TEMP/head" "$RUNNER_TEMP/base"
          cp target/release/openmoat "$RUNNER_TEMP/head/"
          if git worktree add --detach "$RUNNER_TEMP/base-src" HEAD^1 &&
            cargo build --locked --release -p openmoat \
              --manifest-path "$RUNNER_TEMP/base-src/Cargo.toml" --target-dir target; then
            cp target/release/openmoat "$RUNNER_TEMP/base/"
            echo "base=$RUNNER_TEMP/base/openmoat" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the commit before did not build; latency is held to the fixed limit"
          fi
      - name: guard latency per call
        if: env.RUN_LEG == 'true'
        env:
          BASE: ${{ steps.build.outputs.base }}
        run: |
          base=()
          if [ -n "$BASE" ]; then base=(--base "$BASE"); fi
          python3 scripts/ci/guard-latency.py "${base[@]}" "$RUNNER_TEMP/head/openmoat" 100
      - name: guard latency late in a long session
        if: env.RUN_LEG == 'true'
        env:
          BASE: ${{ steps.build.outputs.base }}
        run: |
          base=()
          if [ -n "$BASE" ]; then base=(--base "$BASE"); fi
          python3 scripts/ci/guard-session-latency.py "${base[@]}" "$RUNNER_TEMP/head/openmoat" 50
      - name: time budget
        if: always() && env.RUN_LEG == 'true'
        env:
          LIMIT: 35
        run: bash scripts/ci/budget.sh "$LIMIT"

  # Not a required check of its own, but behind ci-ok like every job: compares
  # the shell lexer's words with the argv bash builds
  # (crates/openmoat-core/tests/lexer_vs_bash.rs). A divergence is annotated
  # on the run with the line that caused it.
  lexer-vs-bash:
    name: shell lexer against bash
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: start the time budget
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        # The channel, components and targets come from rust-toolchain.toml.
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: lexer-vs-bash
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash --version
      - run: cargo test --locked -p openmoat-core --test lexer_vs_bash -- --ignored --nocapture
      - name: time budget
        if: always()
        env:
          LIMIT: 15
        run: bash scripts/ci/budget.sh "$LIMIT"

  fuzz:
    name: fuzz (smoke)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Nine targets. Long fuzz (600 s each) runs on main, the weekly schedule,
    # by hand and on a PR labelled `ci:full`; any other PR a one-minute smoke.
    # Not knowing (the changes job failed) runs long.
    timeout-minutes: ${{ needs.changes.outputs.long_fuzz != 'false' && 120 || 30 }}
    env:
      SECONDS_PER_TARGET: ${{ needs.changes.outputs.long_fuzz != 'false' && '600' || '60' }}
    steps:
      - name: start the time budget
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        # The nightly the fuzz workspace pins in fuzz/rust-toolchain.toml.
        working-directory: fuzz
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
          shared-key: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: clippy on the fuzz targets
        working-directory: fuzz
        run: cargo clippy --locked -- -D warnings
      - run: cargo install cargo-fuzz --version 0.13.1 --locked
      - run: python3 fuzz/seed_corpus.py
      - name: run every target
        working-directory: fuzz
        run: |
          for target in decide_shell policy_parse host_payload literal_pattern proxy_parse openclaw_json5 repo_policy_merge mcp_relay_framing check_diff_parse; do
            cargo fuzz run -O "$target" "corpus/$target" -- -max_total_time="$SECONDS_PER_TARGET"
          done
      - name: keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
      - name: time budget
        if: always()
        env:
          LIMIT: ${{ needs.changes.outputs.long_fuzz != 'false' && 120 || 30 }}
        run: bash scripts/ci/budget.sh "$LIMIT"

  # The one check the `main` ruleset requires. It waits for every other job
  # (`needs` lists them all; scripts/ci/ci_ok.py fails when one is missing)
  # and runs whatever they did (`always()`), then fails on any failure or
  # cancellation, and on any skip the changes job did not order (a job whose
  # `if:` tests `code != 'false'`, on a documentation-only PR). On a pull
  # request a failed `latency` is a warning, not a failure: timing is
  # reported there, never blocking. A new or renamed job needs no ruleset
  # change.
  ci-ok:
    name: ci-ok
    needs:
      - changes
      - lint
      - crates
      - test
      - stock-linux
      - js-plugins
      - sdk-js
      - latency
      - lexer-vs-bash
      - fuzz
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the merge commit and the base it lands on
      - name: every job passed, or was skipped on the changes job's order
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        # On a pull request the base branch's copy of ci_ok.py judges the run
        # (the merge commit's first parent), not the PR's own, so a PR cannot
        # loosen the verdict on itself; it reads the PR's ci.yml, the workflow
        # that ran. Only while the base has no ci_ok.py does the PR's copy run,
        # with a warning. A push, the schedule and a run by hand use the commit.
        run: |
          script=scripts/ci/ci_ok.py
          if [ "$EVENT" = pull_request ]; then
            if git show HEAD^1:scripts/ci/ci_ok.py > "$RUNNER_TEMP/ci_ok.py"; then
              script="$RUNNER_TEMP/ci_ok.py"
            else
              echo "::warning::the base branch has no ci_ok.py; the pull request's own copy judges this run"
            fi
          fi
          python3 -I "$script" .github/workflows/ci.yml
