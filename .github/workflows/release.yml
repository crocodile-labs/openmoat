# Started from `dist generate` (cargo-dist 0.32.0) and hardened by hand: pinned
# actions, per-job permissions, no expressions in `run:`, crates.io trusted
# publishing. `allow-dirty = ["ci"]` in dist-workspace.toml keeps dist from
# rewriting it; after a dist upgrade, diff against a fresh `dist generate`.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # Dry run: plans and builds every target, publishes nothing.
  workflow_dispatch:
  # Release breakage shows up before a tag: `dist plan` only, not a required check.
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/*/Cargo.toml"
      - dist-workspace.toml
      - scripts/ci/install-dist.sh
      - .github/workflows/release.yml

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only what later jobs need: GitHub drops a job output that might contain a secret,
    # and the whole ~100 KB manifest tripped that check, leaving no build matrix. The
    # full manifest travels as the artifacts-plan-dist-manifest artifact.
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tag: ${{ steps.plan.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/install-dist.sh
        shell: bash
      - id: plan
        shell: bash
        run: |
          if [ -n "$TAG" ]; then
            # Without its own section dist would publish [Unreleased] as the notes.
            if ! grep -qF "## [${TAG#v}]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## [${TAG#v}]' section"
              exit 1
            fi
            dist host --steps=create --tag="$TAG" --output-format=json > plan-dist-manifest.json
          else
            dist plan --output-format=json > plan-dist-manifest.json
          fi
          {
            echo "matrix=$(jq -c .ci.github.artifacts_matrix plan-dist-manifest.json)"
            echo "tag=$(jq -r .announcement_tag plan-dist-manifest.json)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    name: build (${{ join(matrix.targets, ', ') }})
    needs: plan
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
      DIST_ARGS: ${{ matrix.dist_args }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
      # rusqlite compiles SQLite from source; on each Linux arch the musl target is
      # built natively with musl-gcc. cc-rs finds it for x86_64 but not for aarch64.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        # The channel, components and targets come from rust-toolchain.toml.
        run: rustup toolchain install --no-self-update
      - name: release targets
        env:
          TARGETS: ${{ join(matrix.targets, ' ') }}
        run: |
          read -ra targets <<< "$TARGETS"
          rustup target add "${targets[@]}"
      - run: scripts/ci/install-dist.sh
      - name: musl toolchain
        if: contains(join(matrix.targets, ','), 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: build artifacts
        run: |
          read -ra args <<< "$DIST_ARGS"
          dist build ${TAG:+"--tag=$TAG"} --print=linkage --output-format=json "${args[@]}" > dist-manifest.json
      - id: cargo-dist
        name: list artifacts
        run: |
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Installers, the Homebrew formula and sha256.sum, from the local artifacts.
  build-global-artifacts:
    needs: [plan, build-local-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/install-dist.sh
        shell: bash
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${TAG:+"--tag=$TAG"} --output-format=json --artifacts=global > dist-manifest.json
          {
            echo "paths<<EOF"
            jq -r '.upload_files[]' dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Attests every artifact and creates the GitHub release. Tags only.
  host:
    needs: [plan, build-local-artifacts, build-global-artifacts]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign the attestations
      attestations: write # store the attestations
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/install-dist.sh
        shell: bash
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host --tag="$TAG" --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "manifest=$(jq -c . dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - run: rm -f artifacts/*-dist-manifest.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*
      - name: create the GitHub release
        env:
          PRERELEASE: ${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease }}
          TITLE: ${{ fromJson(steps.host.outputs.manifest).announcement_title }}
          BODY: ${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}
          COMMIT: ${{ github.sha }}
        run: |
          {
            echo "> **Alpha**: the hook's decisions are not enforced by the operating system (ADR-013). Only commands inside the host sandboxes \`moat init\` configures, or under \`moat run\`, are confined by the OS. Elsewhere an allowed call runs with your permissions, so a classifier mistake is a security bug."
            echo
            printf '%s\n' "$BODY"
          } > "$RUNNER_TEMP/notes.md"
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" --verify-tag --target "$COMMIT" "${flags[@]}" \
            --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" artifacts/*

  # Pushes Formula/moat.rb to the tap with a fine-grained token scoped to that repository.
  publish-homebrew-formula:
    needs: [plan, host]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    env:
      VERSION: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crocodile-labs/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-global
          path: ${{ runner.temp }}/global
      - name: commit and push the formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          mkdir -p Formula
          cp "$RUNNER_TEMP/global/moat.rb" Formula/moat.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/moat.rb
          git diff --cached --quiet || git commit -m "moat $VERSION"
          git push "https://x-access-token:${TAP_TOKEN}@github.com/crocodile-labs/homebrew-tap.git" HEAD

  # crates.io trusted publishing (OIDC): no long-lived token. Waits for an owner to
  # approve the `release` environment. The crates must exist before trusted
  # publishing can be configured, so the first release is published by hand.
  publish-crates:
    needs: [plan, host]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # Publishes in dependency order (openmoat-core, then openmoat-hosts, openmoat-audit
      # and openmoat-proxy, then openmoat) and waits for each to appear in the index.
      - run: cargo publish --locked --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
