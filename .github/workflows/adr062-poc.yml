# Not a required check: ADR-062 step 0 (the proof of concept of request rules
# in `openmoat run`) measured on real clients against the real api.github.com.
# It reaches the network, so it never gates a pull request; it runs when the
# files it measures change, and by hand. Its job summary is the table that
# goes into ADR-062 "Step 0 results". No token or secret is given to it.
name: adr-062 poc

on:
  pull_request:
    paths:
      - crates/openmoat-proxy/**
      - crates/openmoat-cli/src/proxy_ca.rs
      - crates/openmoat-cli/src/proxy_ca/**
      - crates/openmoat-cli/src/commands/run.rs
      - crates/openmoat-cli/src/commands/proxy.rs
      - scripts/ci/adr062-poc.py
      - scripts/ci/latency_ab.py
  workflow_dispatch:

concurrency:
  group: adr062-poc-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: adr-062 step 0 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `openmoat run` needs macOS 13 or later; macos-15 has it.
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        # The channel, components and targets come from rust-toolchain.toml.
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Node 24: its `fetch` follows HTTPS_PROXY with NODE_USE_ENV_PROXY=1.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: bubblewrap for openmoat run's network namespace
        if: runner.os == 'Linux'
        # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces bwrap needs.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap python3-requests
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: build
        run: cargo build --locked --release -p openmoat
      - name: clients and latency through the terminating proxy
        # GH_TOKEN and GITHUB_TOKEN are not passed: the script builds its own
        # environment (PATH and a throwaway HOME) for every command.
        run: python3 scripts/ci/adr062-poc.py target/release/openmoat 30
