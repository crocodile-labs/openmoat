name: weekly

# Not required checks: nothing here gates a pull request (CONTRIBUTING "Toolchain
# and MSRV", "Coverage").
# - toolchain canary: clippy and the tests on the latest stable and beta, so a new
#   compiler or clippy release surfaces before the pinned toolchain moves to it.
# - coverage: line coverage of the workspace on the pinned toolchain, kept as an
#   artefact (lcov and HTML) with a per-crate table in the job summary. No service.
# - macOS Intel: the tests on macos-15-intel, in three parts. Pull requests and
#   main test macOS on Apple silicon only: no macOS code depends on the CPU
#   (`target_arch` appears in Linux code only), and Intel runners are about
#   2.5 times slower. Tests only: the lints run on the other jobs.
# - quarantined tests: the tests .config/nextest-quarantine.md holds out of
#   CI's runs, run on their own and reported, never failing.
# Each job's time is compared with its limit (scripts/ci/budget.sh). A red run
# shows on the Actions page and in GitHub's notification to the workflow's
# last editor.
on:
  schedule:
    - cron: "41 6 * * 1" # Mondays, after the weekly ci run
  workflow_dispatch:

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  # The tests on macOS Intel, in three parts (nextest `--partition
  # slice:k/3`, profile `ci-intel`: the `ci` rules with 2.5 times the time).
  intel:
    name: macos intel (${{ matrix.part }}/3)
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings
      NEXTEST_PROFILE: ci-intel
      GATE_STEPS: test
      GATE_PARTITION: ${{ matrix.part }}/3
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - name: start the time budget
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        # The channel, components and targets come from rust-toolchain.toml.
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: intel-${{ matrix.part }}
      - name: cargo-nextest (pinned, checksum verified)
        run: scripts/ci/install-nextest.sh "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"
      - name: the tests, part ${{ matrix.part }} of 3
        run: scripts/ci/quality-gate.sh
      - name: keep the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-intel-${{ matrix.part }}
          path: target/nextest/ci-intel/junit.xml
          if-no-files-found: ignore
          retention-days: 30
      - name: time budget
        if: always()
        env:
          LIMIT: 60
        run: bash scripts/ci/budget.sh "$LIMIT"

  # The quarantined tests (.config/nextest-quarantine.md), on Linux: reported,
  # never failing the workflow, so a fixed test can leave the table.
  quarantined:
    name: quarantined tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    env:
      RUSTFLAGS: -D warnings
      NEXTEST_PROFILE: ci
    steps:
      - name: start the time budget
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: which tests
        id: which
        run: |
          filter=$(python3 -I scripts/ci/quarantine.py only)
          echo "filter=$filter" >> "$GITHUB_OUTPUT"
          if [ -z "$filter" ]; then echo "::notice::no test is quarantined"; fi
      - name: rust toolchain
        if: steps.which.outputs.filter != ''
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.which.outputs.filter != ''
      - name: cargo-nextest (pinned, checksum verified)
        if: steps.which.outputs.filter != ''
        run: scripts/ci/install-nextest.sh "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"
      - name: bubblewrap for the isolated tier
        if: steps.which.outputs.filter != ''
        run: |
          bash scripts/ci/apt-install.sh bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: the quarantined tests
        if: steps.which.outputs.filter != ''
        env:
          FILTER: ${{ steps.which.outputs.filter }}
        run: |
          status=0
          cargo nextest run --locked --workspace --all-features --no-fail-fast -E "$FILTER" || status=$?
          python3 -I scripts/ci/junit_summary.py target/nextest/ci/junit.xml
          exit "$status"
      - name: time budget
        if: always()
        env:
          LIMIT: 45
        run: bash scripts/ci/budget.sh "$LIMIT"

  canary:
    name: toolchain canary (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    env:
      # Overrides the channel rust-toolchain.toml pins.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      RUSTFLAGS: -D warnings
    steps:
      - name: start the time budget
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.toolchain }}
      - name: bubblewrap for the isolated tier
        # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces bwrap needs.
        run: |
          bash scripts/ci/apt-install.sh bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: time budget
        if: always()
        env:
          LIMIT: 45
        run: bash scripts/ci/budget.sh "$LIMIT"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: start the time budget
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        # The channel comes from rust-toolchain.toml; llvm-cov needs llvm-tools.
        run: |
          rustup toolchain install --no-self-update
          rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: bubblewrap for the isolated tier
        # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces bwrap needs.
        run: |
          bash scripts/ci/apt-install.sh bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: tests under coverage
        run: cargo llvm-cov --locked --workspace --all-features --lcov --output-path lcov.info
      - name: reports
        run: |
          cargo llvm-cov report --html --output-dir coverage
          cp lcov.info coverage/
          {
            echo "## Line coverage"
            echo
            python3 scripts/ci/coverage-summary.py lcov.info
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          retention-days: 30
      - name: time budget
        if: always()
        env:
          LIMIT: 45
        run: bash scripts/ci/budget.sh "$LIMIT"

  # One long agent session (scripts/ci/guard-long-session.py, ADR-080): 3,000
  # hook decisions and their audit writes, as separate hook processes and
  # relayed through one long-lived `openmoat run`; latency drift and memory
  # growth per window of 500 calls, in the job summary. Fails only on a clear
  # trend. `--require-run` on Linux; on macOS the run part reports instead of
  # failing when `openmoat run` cannot start.
  long-session:
    name: long session (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - name: start the time budget
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        # The channel, components and targets come from rust-toolchain.toml.
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: bubblewrap for the isolated tier
        if: runner.os == 'Linux'
        # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces bwrap needs.
        run: |
          bash scripts/ci/apt-install.sh bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: build
        run: |
          cargo build --locked --release -p openmoat
          mkdir -p "$RUNNER_TEMP/head"
          cp target/release/openmoat "$RUNNER_TEMP/head/"
      - name: drift and memory over one long session
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          require=()
          if [ "$RUNNER_OS_NAME" = Linux ]; then require=(--require-run); fi
          python3 scripts/ci/guard-long-session.py "${require[@]}" "$RUNNER_TEMP/head/openmoat" 3000
      - name: time budget
        if: always()
        env:
          LIMIT: 45
        run: bash scripts/ci/budget.sh "$LIMIT"
