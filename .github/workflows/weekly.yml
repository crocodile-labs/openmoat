name: weekly

# Not required checks: nothing here gates a pull request (CONTRIBUTING "Toolchain
# and MSRV", "Coverage").
# - toolchain canary: clippy and the tests on the latest stable and beta, so a new
#   compiler or clippy release surfaces before the pinned toolchain moves to it.
# - coverage: line coverage of the workspace on the pinned toolchain, kept as an
#   artefact (lcov and HTML) with a per-crate table in the job summary. No service.
on:
  schedule:
    - cron: "41 6 * * 1" # Mondays, after the weekly ci run
  workflow_dispatch:

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  canary:
    name: toolchain canary (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    env:
      # Overrides the channel rust-toolchain.toml pins.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.toolchain }}
      - name: bubblewrap for the isolated tier
        # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces bwrap needs.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        # The channel comes from rust-toolchain.toml; llvm-cov needs llvm-tools.
        run: |
          rustup toolchain install --no-self-update
          rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: bubblewrap for the isolated tier
        # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces bwrap needs.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: tests under coverage
        run: cargo llvm-cov --locked --workspace --all-features --lcov --output-path lcov.info
      - name: reports
        run: |
          cargo llvm-cov report --html --output-dir coverage
          cp lcov.info coverage/
          {
            echo "## Line coverage"
            echo
            python3 scripts/ci/coverage-summary.py lcov.info
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          retention-days: 30
