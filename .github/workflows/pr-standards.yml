name: pr-standards

# `pull_request_target`, so a pull request from a fork gets its labels too: a
# `pull_request` run from a fork has a read-only token, which cannot add them.
# Safe here because the job never checks out or runs the pull request's code:
# it reads the title (through an environment variable, never pasted into a
# script), the file list and the body with `gh`, and edits labels.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, no PR code runs
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  label-and-check:
    name: labels · size · risk · body
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'dependabot[bot]'
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: derive labels
        id: derive
        shell: bash
        run: |
          set -euo pipefail
          files=$(gh pr view "$PR" --repo "$REPO" --json files --jq '.files[].path')
          added=$(gh pr view "$PR" --repo "$REPO" --json files --jq '[.files[].additions] | add // 0')
          deleted=$(gh pr view "$PR" --repo "$REPO" --json files --jq '[.files[].deletions] | add // 0')
          total=$((added + deleted))

          type=""
          title_re='^(feat|fix|sec|policy|host|docs|test|refactor|perf|build|ci|chore)(\([^)]+\))?!?: '
          if [[ "$TITLE" =~ $title_re ]]; then
            type="type: ${BASH_REMATCH[1]}"
          fi

          areas=()
          has() { grep -qE "$1" <<<"$files"; }
          has '^crates/openmoat-core/'      && areas+=("area: core")
          has '^crates/openmoat-hosts/'     && areas+=("area: hosts")
          has '^crates/openmoat-audit/'     && areas+=("area: audit")
          has '^crates/openmoat-proxy/'     && areas+=("area: proxy")
          has '^crates/openmoat-cli/'       && areas+=("area: cli")
          has '^(crates/openmoat-core/policies/|tests/conformance/)' && areas+=("area: policy")
          has '^(\.github/|scripts/)'   && areas+=("area: ci")
          has '(^docs/|\.md$)'          && areas+=("area: docs")
          has '^(Cargo\.(toml|lock)|crates/[^/]+/Cargo\.toml|deny\.toml)$' && areas+=("area: deps")

          if   (( total <= 10 ));  then size="size: XS"
          elif (( total <= 50 ));  then size="size: S"
          elif (( total <= 200 )); then size="size: M"
          elif (( total <= 500 )); then size="size: L"
          else size="size: XL"; fi

          risk="risk: low"
          if has '^(crates/openmoat-hosts/|crates/openmoat-cli/src/install/|crates/openmoat-audit/)'; then risk="risk: medium"; fi
          if has '^(crates/openmoat-core/src/(engine|policy|shell|lexer|pattern|paths)|crates/openmoat-core/policies/|\.github/workflows/|SECURITY\.md|crates/openmoat-cli/src/commands/guard\.rs|crates/openmoat-cli/src/exit\.rs|crates/openmoat-proxy/src/|crates/openmoat-cli/src/(sandbox|integrity|secrets)/|crates/openmoat-cli/src/commands/run(\.rs|/))'; then risk="risk: high"; fi

          behaviour_change=false
          has '^crates/openmoat-core/(src|policies)/' && behaviour_change=true
          fixture_touched=false
          has '^tests/conformance/' && fixture_touched=true

          {
            echo "type=$type"
            printf 'areas<<EOF\n%s\nEOF\n' "$(printf '%s\n' "${areas[@]:-}")"
            echo "size=$size"
            echo "risk=$risk"
            echo "total=$total"
            echo "behaviour_change=$behaviour_change"
            echo "fixture_touched=$fixture_touched"
          } >> "$GITHUB_OUTPUT"

      - name: apply labels
        shell: bash
        env:
          TYPE: ${{ steps.derive.outputs.type }}
          AREAS: ${{ steps.derive.outputs.areas }}
          SIZE: ${{ steps.derive.outputs.size }}
          RISK: ${{ steps.derive.outputs.risk }}
          BEHAVIOUR_CHANGE: ${{ steps.derive.outputs.behaviour_change }}
          FIXTURE_TOUCHED: ${{ steps.derive.outputs.fixture_touched }}
        run: |
          set -euo pipefail
          mapfile -t current < <(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          desired=()
          [[ -n "$TYPE" ]] && desired+=("$TYPE")
          while IFS= read -r a; do [[ -n "$a" ]] && desired+=("$a"); done <<<"$AREAS"
          desired+=("$SIZE" "$RISK")
          if [[ "$BEHAVIOUR_CHANGE" == "true" && "$FIXTURE_TOUCHED" == "false" ]]; then
            desired+=("needs: fixture")
          fi
          managed() { case "$1" in "size: override") return 1 ;; "type: "*|"area: "*|"size: "*|"risk: "*|"needs: fixture") return 0 ;; *) return 1 ;; esac; }
          contains() { local x; for x in "${@:2}"; do [[ "$x" == "$1" ]] && return 0; done; return 1; }
          args=()
          for l in "${current[@]}"; do
            if managed "$l" && ! contains "$l" "${desired[@]}"; then args+=(--remove-label "$l"); fi
          done
          for l in "${desired[@]}"; do
            if ! contains "$l" "${current[@]}"; then args+=(--add-label "$l"); fi
          done
          if (( ${#args[@]} )); then gh pr edit "$PR" --repo "$REPO" "${args[@]}"; else echo "labels already correct"; fi

      - name: check body and size
        shell: bash
        env:
          TYPE: ${{ steps.derive.outputs.type }}
          AREAS: ${{ steps.derive.outputs.areas }}
          SIZE: ${{ steps.derive.outputs.size }}
          TOTAL: ${{ steps.derive.outputs.total }}
          RISK: ${{ steps.derive.outputs.risk }}
        run: |
          set -euo pipefail
          body=$(gh pr view "$PR" --repo "$REPO" --json body --jq .body)
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')
          fail=0
          section() { # heading -> non-empty, non-placeholder content required
            local content
            content=$(awk -v h="## $1" '
              $0==h {on=1; next} /^## / {on=0} on' <<<"$body" | grep -vE '^\s*(<!--.*-->)?\s*$' | grep -vE '^- \[ \]' || true)
            if [[ -z "$content" ]]; then echo "::error::PR body section '## $1' is missing or empty"; fail=1; fi
          }
          section "Testing"
          section "Security impact"
          if [[ -z "$TYPE" ]]; then
            echo "::error::title must start with a Conventional Commits type (feat, fix, sec, policy, host, docs, test, refactor, perf, build, ci, chore)"; fail=1
          fi
          if [[ "$SIZE" == "size: XL" ]] && ! grep -qx 'size: override' <<<"$labels"; then
            echo "::error::change is $TOTAL lines; split it, or add the 'size: override' label with a justification in the PR"; fail=1
          fi
          {
            echo "### pr-standards"
            echo "- type: \`$TYPE\`"
            echo "- areas: \`$AREAS\`"
            echo "- size: \`$SIZE\` ($TOTAL lines)"
            echo "- risk: \`$RISK\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $fail
