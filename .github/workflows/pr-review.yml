name: pr-review

# Automated first-pass review by `moat-reviewer`, a GitHub App owned by the org.
# Advisory only: it posts inline comments and one summary per revision; it never
# approves, requests changes or pushes. Maintainers own the verdict (CODEOWNERS).
#
# Runs for same-repository pull requests. Fork PRs carry no secrets, so a
# maintainer triggers a review there by commenting `@moat-reviewer`. That run
# holds the model credential and the app token while the PR's code is checked
# out, so it gets read-only tools: building or testing the PR (build scripts,
# tests, the gate) would execute untrusted code next to those secrets.
# Setup (secrets, variable, app): .github/moat-reviewer/README.md

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    if: >-
      vars.MOAT_REVIEWER_ENABLED == 'true' &&
      (
        (
          github.event_name == 'pull_request' &&
          !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        ) || (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          contains(github.event.comment.body, '@moat-reviewer') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MOAT_REVIEWER_APP_ID }}
          private-key: ${{ secrets.MOAT_REVIEWER_PRIVATE_KEY }}
          # Only what the reviewer does: read the code, comment on the PR.
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust toolchain
        # The channel, components and targets come from rust-toolchain.toml.
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: review
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          trigger_phrase: "@moat-reviewer"
          track_progress: true
          include_fix_links: false
          exclude_comments_by_actor: "*[bot]"
          claude_args: >-
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*)${{ github.event_name == 'pull_request' && ',Bash(scripts/ci/quality-gate.sh),Bash(cargo test:*),Bash(cargo clippy:*),Bash(cargo run --quiet -p openmoat -- policy:*)' || '' }}"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            You are moat-reviewer, the first-pass reviewer for OpenMoat, a security kernel for AI
            agents. A human maintainer owns the verdict; you find what they would otherwise
            find late. Be direct, specific and short. Review the change, not the author.

            Read AGENTS.md first: its invariants (section 3), engineering rules (4) and
            definition of done (6) are the review standard. Then `gh pr view` and `gh pr diff`.
            The PR branch is checked out. On same-repository PRs you may run
            `scripts/ci/quality-gate.sh`, `cargo test`, `cargo clippy` and
            `cargo run --quiet -p openmoat -- policy check …` to verify a claim instead of
            guessing; on comment-triggered reviews only the read-only `gh` tools are available,
            so reason from the diff and say what you could not verify. Never modify files,
            never push.

            Check, in this order, and look for what is missing as much as what is wrong:
            1. Invariants: deny absolute, strictest wins, unparseable ⇒ ask, every `guard` error
               path ⇒ deny + exit 2, exit codes 0/2/3/64, lock verified before deciding,
               re-pin only from a terminal, nothing secret written to the audit log.
            2. Fail-open paths: a new `Ok(())`, default, `unwrap_or`, early `return`, or
               ignored error that lets an action through when something is wrong.
            3. Core purity: `openmoat-core` gains no I/O, `unsafe`, or dependency; host adapters
               do not decide; library crates do not print.
            4. Shell and path handling: quoting, nesting, wrappers, redirects, `..`, symlinks,
               Windows `C:/` roots, UNC paths; anything an agent could phrase differently to
               slip past a rule.
            5. Tests: a core or policy change has a conformance fixture; an adapter change has
               a golden host payload; e2e tests isolate `HOME`, use `env_clear()` and no
               network; malformed input is covered; the tests fail if the fix is reverted.
            6. Error handling: typed `thiserror` errors in libraries, `bail!`/`ensure!` in the
               CLI, no `unwrap`/`expect` outside tests without a comment, messages that name
               the file or rule and the fix.
            7. Docs in the same PR: `docs/POLICY.md`, `ARCHITECTURE.md`, `THREAT_MODEL.md`, `CHANGELOG.md`,
               crate READMEs and `AGENTS.md` where behaviour, commands or layout changed.
            8. Structure: files ≤ 500 lines, functions ≤ 200, one concern per file, names
               that say what, comments that say why, no dead code or TODOs.
            9. PR hygiene: lowercase Conventional Commits title that matches the change,
               non-empty Testing and Security impact sections that are true, a usable Release
               note, ≤ 500 changed lines or a sensible split.
            Do not comment on anything rustfmt or clippy already enforce, and do not restate
            CI failures; `gh pr checks` shows them.

            How to report:
            - For each concrete finding, post ONE inline comment on the exact line with
              `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`).
              Start with a severity tag and keep it to what / why / fix:
              `🔴 blocker` (breaks an invariant, fails open, security hole, data loss),
              `🟠 should fix` (bug, missing test, wrong doc, platform break),
              `🟡 nit` (clarity, naming, small simplification),
              `💡 idea` (optional, out of scope for this PR).
              Add a ```suggestion block when the fix is a few lines.
            - Then post ONE summary with `gh pr comment`, under 40 lines, in this shape:
              `## moat-reviewer · <short-sha>` followed by a one-line verdict
              (`Ready for maintainer review` or `Needs changes before review`), a table of
              findings by severity with file:line links, a short "Checked and fine" list so
              the author knows what was covered (invariants, tests run, docs), and
              "Gaps beyond this PR" for engineering debt you noticed that deserves an issue.
            - No findings: say so in the summary and name what you verified. Do not invent
              nits to look thorough. Do not approve, request changes, or write a review
              outside GitHub comments.
