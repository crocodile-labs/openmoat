name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # The title was checked on the pull request; in the merge queue the job is
  # skipped, which reports success, so the required `conventional` is met.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  pull-requests: read

jobs:
  conventional:
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            sec
            policy
            host
            docs
            test
            refactor
            perf
            build
            ci
            chore
          requireScope: false
          ignoreLabels: |
            dependencies
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: Subject must start lowercase and describe the change for a user.
