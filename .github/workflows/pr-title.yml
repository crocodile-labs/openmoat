name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            sec
            policy
            host
            docs
            test
            refactor
            perf
            build
            ci
            chore
          requireScope: false
          ignoreLabels: |
            dependencies
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: Subject must start lowercase and describe the change for a user.
