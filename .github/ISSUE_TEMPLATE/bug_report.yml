name: Bug report
description: Something behaves differently from what the docs or policy say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For a policy bypass or anything security-relevant, use the private advisory link instead of this form.
  - type: textarea
    id: bundle
    attributes:
      label: Diagnostic bundle
      description: >-
        Run `openmoat doctor --bundle openmoat-bundle.json` in a terminal of your own. It writes one
        local file with the openmoat version, the operating system, each agent's hook state and
        protection level, the policy version and lint findings, the doctor checks, and the
        last 20 decisions (time, host, tool name, verdict and rule ids only; no commands,
        paths or arguments). Nothing is sent. Read the file, then drag it here.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: openmoat version
      placeholder: output of `openmoat --version`
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options: [Claude Code, Codex, Cursor, OpenClaw, GitHub Copilot CLI, pi, Gemini CLI, Continue CLI, policy check only, other]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.1 / Ubuntu 24.04 / Windows 11
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: The action and the decision you got
      description: The command or path, the rule ids reported, and the output of `openmoat show <id>` if there is one.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: policy
    attributes:
      label: Relevant policy rules
      description: The rule groups involved, or "default policy".
      render: yaml
